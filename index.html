      /* css/base.css — Session 1–3 styles for this area. build.js concatenates CSS_FILES in order. */

/* ---------- Tokens (sampled from the reference "Missions" screen) ---------- */
:root {
  --ink: #6b3a1e; /* chunky title brown */
  --ink-soft: #8a5a3a; /* body text brown */
  --line: #8b5a2b; /* button / outline brown */
  --card: #fffbf2; /* card cream */
  --card-edge: #ebddc4;
  --peach: #f8dcc0; /* illustration backdrop */
  --yellow: #f8c94e; /* button + number badge */
  --yellow-shade: #c98e2e;
  --check-bg: #f4e8a8;
  --check: #6da544; /* green tick */
  --lime: #e3e07a; /* "Continue" button */
  --lime-shade: #a9a43e;
  --paper: #fdf6e6;
  --red: #d9644a;
  --radius-card: 24px;
  --font: 'Fredoka', 'Baloo 2', 'Nunito', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  font-family: var(--font);
  color: var(--ink-soft);
  font-size: 16px;
  line-height: 1.4;
  background-color: #e6ecda;
  background-image:
    radial-gradient(ellipse 60% 30% at 50% 0%, rgba(255, 255, 255, 0.85), transparent 70%),
    radial-gradient(ellipse 35% 25% at 8% 55%, #c4dbae, transparent 70%), radial-gradient(ellipse 30% 28% at 92% 48%, #b9d3a0, transparent 70%),
    radial-gradient(ellipse 25% 18% at 30% 30%, #f4e3c6, transparent 70%), radial-gradient(ellipse 22% 16% at 75% 22%, #f6d8b8, transparent 70%),
    radial-gradient(ellipse 80% 25% at 50% 100%, #d6d0c4, transparent 70%);
  background-attachment: fixed;
}
button {
  font-family: inherit;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid #5b8fd6;
  outline-offset: 2px;
}
#app {
  max-width: 1140px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}
h1,
h2,
h3 {
  color: var(--ink);
  margin: 0;
  font-weight: 700;
}
/* ---------- Title bar ---------- */
.titlebar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.title-pill {
  flex: 1;
  background: #fff;
  border-radius: 999px;
  padding: 8px 20px;
  text-align: center;
  box-shadow: 0 2px 0 rgba(107, 58, 30, 0.08);
}
.title-pill h1 {
  font-size: 30px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  line-height: 1.15;
}
.round-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 0;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 0 rgba(107, 58, 30, 0.1);
}
.round-btn svg {
  width: 26px;
  height: 26px;
}
/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--yellow);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding: 7px 22px;
  min-width: 110px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 4px 0 var(--yellow-shade);
  transition:
    transform 0.06s,
    box-shadow 0.06s;
}
.btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--yellow-shade);
}
.btn.lime {
  background: var(--lime);
  box-shadow: 0 4px 0 var(--lime-shade);
}
.btn.ghost {
  background: #fff;
  box-shadow: 0 4px 0 #d9c7a8;
}
.btn.small {
  font-size: 13px;
  padding: 5px 12px;
  min-width: 0;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.coin {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #f8c94e;
  border: 2px solid var(--line);
  vertical-align: -2px;
  margin-right: 3px;
}
/* ---------- Cards ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius-card);
  box-shadow:
    0 3px 0 var(--card-edge),
    0 10px 24px rgba(107, 58, 30, 0.08);
  overflow: hidden;
  position: relative;
}
.card-art {
  background: var(--peach);
  padding: 16px 12px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  position: relative;
}
.card-body {
  padding: 18px 20px 22px;
}
.shelf-row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
}
.shelf-row .bottle {
  width: 38px;
  height: 76px;
}
.critter-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 8px;
}
.critter {
  width: 58px;
  height: 58px;
}
.bottle {
  width: 36px;
  height: 72px;
  display: block;
}
.bottle.big {
  width: 70px;
  height: 140px;
}
/* ---------- Checks + tags + chips ---------- */
.check {
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 6px;
  background: var(--check-bg);
  border: 2px solid #d8c06a;
  display: inline-grid;
  place-items: center;
  color: var(--check);
}
.check svg {
  width: 20px;
  height: 20px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 6px 0;
  justify-content: center;
}
.tag {
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 999px;
  background: #f3e9d6;
  color: var(--ink-soft);
  border: 1px solid #e2d2b4;
}
.tag.on {
  background: #ddefc7;
  border-color: #9cc46f;
  color: #3f6b21;
}
button.tag {
  cursor: pointer;
  font-family: inherit;
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  background: #fff;
  border-radius: 999px;
  padding: 3px 12px;
  color: var(--ink);
  font-weight: 600;
  font-size: 14px;
  border: 2px solid #efe2c8;
}
.chip.neg {
  color: var(--red);
}
/* ---------- Boot / forms ---------- */
.boot {
  display: grid;
  place-items: center;
}
.hero-card,
.form-card,
.summary-card {
  width: min(480px, 100%);
  text-align: center;
}
.hero-card .card-art {
  padding-top: 26px;
}
.lead {
  color: var(--ink-soft);
  margin: 0 0 16px;
}
.lead.small {
  font-size: 14px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  margin: 6px 0 16px;
}
.fine {
  font-size: 12px;
  opacity: 0.8;
  margin: 0;
}
.field {
  display: block;
  text-align: left;
  margin-bottom: 14px;
}
.field span {
  display: block;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.field input {
  width: 100%;
  font: inherit;
  color: var(--ink);
  padding: 9px 12px;
  border-radius: 12px;
  border: 2px solid #e2d2b4;
  background: #fff;
}
/* ---------- Missions (mirrors reference layout) ---------- */
.missions {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(160px, 1fr);
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
}
.mission {
  text-align: center;
  display: flex;
  flex-direction: column;
}
.mission .card-art {
  height: 150px;
  padding-bottom: 26px;
}
.mission .art-critter {
  position: absolute;
  left: 8px;
  bottom: 16px;
}
.mission .art-critter .critter {
  width: 40px;
  height: 40px;
}
.mission .num {
  width: 36px;
  height: 36px;
  margin: -18px auto 0;
  position: relative;
  z-index: 1;
  background: var(--yellow);
  color: var(--ink);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 20px;
  box-shadow: 0 3px 0 var(--yellow-shade);
}
.mission .card-body {
  padding: 10px 12px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
.mission h2 {
  font-size: 17px;
  text-transform: uppercase;
  line-height: 1.1;
  min-height: 38px;
  display: grid;
  place-items: center;
}
.goals {
  list-style: none;
  padding: 0;
  margin: 8px 0;
  display: grid;
  gap: 5px;
  text-align: left;
}
.goals li {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 12.5px;
  color: var(--ink);
}
.goals small {
  opacity: 0.75;
}
.desc {
  font-size: 12.5px;
  margin: 0 0 12px;
  flex: 1;
}
.mission.locked .card-art {
  filter: grayscale(0.7) opacity(0.6);
}
/* ---------- Popup + toast ---------- */
.popup-layer {
  position: fixed;
  inset: 0;
  background: rgba(107, 58, 30, 0.35);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
}
.popup {
  background: var(--card);
  border-radius: var(--radius-card);
  width: min(420px, 100%);
  max-height: 90vh;
  overflow: auto;
  padding: 26px 22px 20px;
  text-align: center;
  position: relative;
  box-shadow: 0 4px 0 var(--card-edge);
  animation: pop 0.22s ease-out;
}
.popup-badge {
  display: inline-block;
  background: var(--yellow);
  color: var(--ink);
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 16px;
  margin-bottom: 10px;
  box-shadow: 0 3px 0 var(--yellow-shade);
}
.popup p {
  text-align: left;
}
.popup-actions {
  margin-top: 12px;
}
.pop-art {
  display: flex;
  justify-content: center;
}
@keyframes pop {
  from {
    transform: scale(0.9);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
#toasts {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  z-index: 60;
  width: min(560px, calc(100% - 24px));
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 9px 18px;
  border-radius: 18px;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
}
@media (prefers-reduced-motion: reduce) {
  .popup {
    animation: none;
  }
  .btn {
    transition: none;
  }
}
/* ---------- v2 additions ---------- */
.center {
  text-align: center;
}
.small {
  font-size: 14px;
}
.neg {
  color: var(--red);
}
.chip.neg {
  border-color: #f0c0b0;
  color: var(--red);
}
.banner.warn {
  background: #fbe3c8;
  border-color: var(--yellow-shade);
  margin-bottom: 12px;
}
.tag[role='button'] {
  cursor: help;
}
.tag.near {
  background: #fbebc0;
  border-color: var(--yellow-shade);
  color: var(--ink);
}
.price {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.shelf-label small {
  font-weight: 500;
  opacity: 0.85;
}
.shelf-more {
  font-weight: 700;
  color: var(--ink);
  align-self: center;
  padding: 0 6px 8px;
}
.decor-wall {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  background: #f6e7ce;
  border-radius: 14px;
  padding: 6px 10px;

}
.decor {
  width: 44px;

}
.stock-card .decor {
  width: 64px;

}
.decor-item {
  display: inline-block;
}
.menu-card.dim {
  opacity: 0.7;
}
.menu-card b {

}
.menu-card small {

}
.menu-card.primary {
  background: #fff3c4;
}
.buy-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
.fresh {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #c6ddf0;
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 1px 8px;
  border: 1.5px solid #8fb2d0;
}
.shelf-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: #f6e7ce;
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 8px;
  color: var(--ink);
}
.pill.small {
  font-size: 12px;
  padding: 2px 9px;
}
.bottle-card[aria-disabled='true'] {
  cursor: default;
}
.report {
  text-align: left;
  padding-left: 20px;
  margin: 8px 0;
  display: grid;
  gap: 4px;
}
.mix-done {
  display: grid;
  place-items: center;
  background: #f7ebd3;
  border-radius: 14px;
  padding: 10px;
}
.mix-groups {
  margin-bottom: 10px;
}
.ing small {
  display: block;
  font-size: 10.5px;
  opacity: 0.8;
}
.glass-pill .glass {
  width: 22px;
  height: 22px;
}
.page.full {
  grid-column: 1 / -1;
  min-height: 0;
}
.tree {
  display: grid;
  gap: 10px;
}
.tree-root {
  justify-self: center;
  background: var(--yellow);
  color: var(--ink);
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 18px;
  box-shadow: 0 3px 0 var(--yellow-shade);
}
.tree-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));

}
.branch {

  border: 2px solid #e2d2b4;
  border-radius: 14px;
  padding: 8px 10px;

}

}
.branch b {

}
.branch small {

}
.prog {
  height: 9px;

  border: 1.5px solid #e2d2b4;
  margin: 4px 0 2px;
}
.prog i {
  display: block;
  height: 100%;
  background: var(--check);
  border-radius: 999px;
}
.page h4 {
  color: var(--ink);
  margin: 10px 0 2px;
}
.icon.static {
  cursor: default;
  text-align: center;
  font-size: 11px;
}
.icon.static small {
  display: block;
}
.region-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.stamps {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.stamp {
  border: 2px dashed #d9be92;
  background: #fff;
  color: var(--ink-soft);
  border-radius: 10px;
  padding: 3px 9px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.stamp.on {
  border-style: solid;
  border-color: var(--check);
  background: #eaf3d9;
  color: var(--ink);
  font-weight: 600;
}
.stamp.sel {
  outline: 3px solid var(--yellow);
}
.passport-detail {
  margin-bottom: 14px;
}
.timeline {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(210px, 1fr);
  gap: 12px;

  padding-bottom: 10px;
}
.era {
  background: var(--card);
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 3px 0 var(--card-edge);

  flex-direction: column;
  gap: 8px;
}
.era h3 {
  font-size: 17px;
}
.exhibit {
  background: #fff;
  border: 2px solid #efe2c8;
  border-radius: 12px;
  padding: 8px;
  font-size: 13.5px;
}
.exhibit b {
  color: var(--ink);
  display: block;
  margin-bottom: 4px;
}
.exhibit.owned {
  background: #fff6da;
  border-color: #e8cf7a;
}
.exhibit p {
  margin: 0;
}
.era-drinks {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tech-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
}
.tech {
  background: #fff;
  border: 2px solid #efe2c8;
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
}
.tech b {
  color: var(--ink);
}
.tech small {
  font-size: 13px;
}
.tech.owned {
  background: #eaf3d9;
  border-color: #bbd79a;
}
.stock-card.rare {
  background: #fff9e8;
}
.stock-card.rare .new {
  background: var(--yellow-shade);
}
/* ---------- v3 additions ---------- */
html.text-s {
  font-size: 14px;
}
html.text-l {
  font-size: 19px;
}
html.text-l body,
html.text-l .btn {
  font-size: 1.08em;
}
html.reduce-motion *,
html.reduce-motion *::before {
  animation: none !important;
  transition: none !important;
}
#tag-pop {
  position: absolute;
  z-index: 70;
  max-width: 260px;
  background: var(--ink);
  color: #fff;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
}
#tag-pop b {
  color: var(--yellow);
  margin-right: 4px;
}
.slots {

  margin-bottom: 12px;
}
.slot {

  color: var(--ink);

}
.slot.on {

  background: #fff3c4;
}
.slot small {
  display: block;
  font-size: 11px;
}
textarea {
  width: 100%;
  font: inherit;

  border: 2px solid var(--card-edge);
  border-radius: 12px;
  padding: 8px;

  color: var(--ink);
}
.file-btn {
  cursor: pointer;
}
#settings h3 {
  margin: 12px 0 4px;

}
#dev-panel {

  top: 6px;
  left: 6px;

  padding: 6px 8px;
  border-radius: 10px;
  font-size: 12px;

#dev-panel input {
  width: 60px;
}
#coach {
  position: fixed;
  bottom: 16px;
  right: 16px;

#coach .critter {

#coach p {

.coach-target {

@keyframes coachPulse {

    outline-color: var(--yellow-shade);

.patience {

}
.patience i {

  width: 100%;

.patience i.low {

.customer-card {

main.serve.t-dusk {

main.serve.t-night {

  border-radius: 24px;
}

html.cb .dot b {

}
html.cb .result .grade::before {

}
.dot.refused {

.dot.illegal {

}
.dot.left {
  background: #bdb2a0;
}

}

.result.left {

html.cb .result.good .grade::before {

html.cb .result.miss .grade::before {

.idcard {

.id-head {

.id-body {

.id-photo {
  width: 92px;
  height: 110px;
  background: #fff;
  border: 2px solid #8e7ab5;
  border-radius: 6px;
  overflow: hidden;
  flex: none;
}
.id-photo .face {
  width: 100%;
  height: 100%;
  filter: saturate(0.55) contrast(1.05);
}
.idcard dl {
  margin: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 8px;
  font-size: 13px;
  align-content: start;
}
.idcard dt {
  font-weight: 700;
  opacity: 0.7;
  font-size: 11px;
  text-transform: uppercase;
  align-self: center;
}
.idcard dd {
  margin: 0;
  font-weight: 700;
}
.idcard dd.script {
  font-family: 'Brush Script MT', 'Segoe Script', 'Comic Sans MS', cursive;
  font-style: italic;
  font-weight: 400;
  font-size: 16px;
  color: #2b4a8a;
}
.id-foot {
  height: 18px;
  background: repeating-linear-gradient(90deg, #c9b8e6 0 6px, #ede3f7 6px 12px);
}
.id-foot .bottle {
  display: none;
}
.star {
  font-size: 13px;
  margin-left: 2px;
}
.star.bronze {
  color: #b8733a;
}
.star.silver {
  color: #9aa0a6;
}
.star.gold {
  color: var(--yellow-shade);
}
.amt {
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  background: #fff3c4;
  border: 1.5px solid var(--yellow-shade);
  border-radius: 8px;
  padding: 1px 6px;
  color: var(--ink);
  cursor: pointer;
  margin-right: 3px;
}
.amt.fixed {
  background: #f1e4c9;
  border-color: #e2d2b4;
  cursor: default;
}
.chosen-ing {
  display: inline-flex;
  align-items: center;
  margin: 2px;
}
.garnish-dot {
  display: inline-block;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid #6e3b1f;
}
.creation-form {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 8px 0;
}
.creation-form input {
  font: inherit;
  border: 2px solid var(--card-edge);
  border-radius: 12px;
  padding: 6px 10px;
}
.stars-row {
  color: var(--yellow-shade);
  letter-spacing: 2px;
}
.stars-row i {
  color: #e2d2b4;
  font-style: normal;
}
.rarity {
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 1px 8px;
  border: 1.5px solid;
}
.r-common {
  color: #8a5a3a;
  border-color: #d9be92;
}
.r-unusual {
  color: #7e3fa0;
  border-color: #c9a2e0;
}
.r-regional {
  color: #2f6b8a;
  border-color: #9cc4dc;
}
.r-historic {
  color: #8a5a1e;
  border-color: #e3b96a;
}
.r-rare {
  color: #b8860b;
  border-color: var(--yellow-shade);
  background: #fff3c4;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.ccard {
  background: #fff;
  border: 3px solid #e2d2b4;
  border-radius: 14px;
  padding: 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--ink);
}
.ccard.r-rare {
  border-color: var(--yellow-shade);
  background: #fff9e0;
}
.ccard.r-historic {
  border-color: #e3b96a;
}
.ccard.r-unusual {
  border-color: #c9a2e0;
}
.ccard.r-regional {
  border-color: #9cc4dc;
}
.ccard .bottle {
  width: 40px;
  height: 80px;
}
.ccard small {
  font-size: 11px;
}
.chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  margin: 10px 0;
}
.chain-step {
  background: #fff;
  border: 2px solid #e2d2b4;
  border-radius: 12px;
  padding: 4px;
  width: 78px;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
}
.chain-step.on {
  border-color: var(--yellow-shade);
  background: #fff3c4;
}
.chain-step small {
  display: block;
  font-size: 10.5px;
}
.machine {
  width: 54px;
  height: 54px;
}
.arrow {
  color: var(--ink-soft);
  font-weight: 700;
}
.flavor-map,
.world-map,
.ledger {
  width: 100%;
  height: auto;
  display: block;
}
.mapdot {
  fill: #fff;
  stroke: #8b5a2b;
  stroke-width: 1.5;
}
.mapdot.on {
  fill: var(--check);
  stroke: #3f6b26;
}
.std-drinks {
  width: 100%;
  max-width: 320px;
}
.game-card .card-body {
  text-align: center;
}
.sort-card {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: #fff;
  border: 3px dashed var(--yellow-shade);
  border-radius: 16px;
  padding: 10px 18px;
  margin: 8px auto;
  cursor: grab;
  color: var(--ink);
}
.sort-card .bottle,
.sort-card .glass {
  width: 50px;
  height: 80px;
}
.bins {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.bin {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: #f6e7ce;
  border: 3px solid #d9be92;
  border-radius: 14px;
  padding: 16px 8px;
  cursor: pointer;
}
.bin.over,
.bin:hover {
  background: #fff3c4;
  border-color: var(--yellow-shade);
}
.masked {
  font-size: 24px;
  letter-spacing: 0.15em;
  font-weight: 700;
  color: var(--ink);
}
.bingo {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  max-width: 360px;
  margin: 10px auto;
}
.cell {
  font: inherit;
  background: #fff;
  border: 2px solid #e2d2b4;
  border-radius: 12px;
  padding: 14px 4px;
  color: var(--ink);
  cursor: pointer;
}
.cell.on {
  background: #eaf3d9;
  border-color: var(--check);
  font-weight: 700;
}
.timing {
  position: relative;
  height: 34px;
  background: #f1e4c9;
  border: 2px solid #d9be92;
  border-radius: 999px;
  margin: 14px 0 4px;
  overflow: hidden;
}
.timing .zone {
  position: absolute;
  top: 0;
  bottom: 0;
  background: #bfe0a0;
}
.timing .marker {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 6px;
  margin-left: -3px;
  background: var(--ink);
  border-radius: 3px;
}
.timing.sake {
  background: linear-gradient(90deg, #c6ddf0, #fbe3c8, #f6b8a0);
}
.timing.agave {
  background: linear-gradient(90deg, #e3e07a, #e0a526, #7a2a18);
}
.timing-scale {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-soft);
}
.stir-pad {
  width: 220px;
  height: 220px;
  margin: 8px auto;
  border-radius: 50%;
  border: 3px dashed var(--yellow-shade);
  display: grid;
  place-items: center;
  touch-action: none;
  position: relative;
}
.stir-pad .glass {
  width: 110px;
  height: 110px;
}
.stir-prog {
  position: absolute;
  bottom: -18px;
  left: 20px;
  right: 20px;
  height: 8px;
  background: #f1e4c9;
  border-radius: 999px;
  overflow: hidden;
}
.stir-prog i {
  display: block;
  height: 100%;
  background: var(--check);
}
.queue {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0;
}
.qcust {
  background: #fff;
  border: 2px solid #e2d2b4;
  border-radius: 12px;
  padding: 6px 10px;
  color: var(--ink);
}
.qcust.now {
  border-color: var(--yellow-shade);
  background: #fff3c4;
  font-weight: 700;
}
.rush-top {
  display: flex;
  gap: 8px;
}
.flashcard {
  background: #fff;
  border: 3px solid #e2d2b4;
  border-radius: 18px;
  padding: 14px;
  max-width: 420px;
  margin: 8px auto;
}
.flashcard.flip {
  border-color: var(--check);
}
.france {
  width: 100%;
  max-width: 360px;
  display: block;
  margin: 0 auto;
}
.region-dot {
  cursor: pointer;
}
.region-dot:hover circle {
  fill: var(--lime);
}
.best {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 6px;
}
.best li {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
}
.best .bottle {
  width: 20px;
  height: 40px;
}
.cert {
  width: 100%;
  max-width: 520px;
  display: block;
  margin: 0 auto;
}
.letter {
  width: 160px;
}
@media print {
  body * {
    visibility: hidden;
  }
  #certificate,
  #certificate * {
    visibility: visible;
  }
  #certificate {
    position: absolute;
    left: 0;
    top: 0;
  }
}
/* ---------- Small screens ---------- */
@media (max-width: 820px) {
  .hub,
  .serve {
    grid-template-columns: 1fr;
  }
  .book {
    grid-template-columns: 1fr;
  }
  .page {
    min-height: 0;
  }
  .mix-zone {
    grid-template-columns: 1fr;
  }
  .region-grid {
    grid-template-columns: 1fr;
  }
  .id-body {
    flex-direction: column;
    align-items: center;
  }
  .slots {
    grid-template-columns: 1fr;
  }
  #coach {
    left: 10px;
    right: 10px;
    max-width: none;
  }
  .shelf-info {
    flex-direction: column;
    align-items: flex-start;
  }
  .title-pill h1 {
    font-size: 22px;
  }
}

/* css/shop.css — Session 1–3 styles for this area. build.js concatenates CSS_FILES in order. */
/* ---------- Hub ---------- */
.hub {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  gap: 18px;
  align-items: start;
}
.banner {
  grid-column: 1 / -1;
  background: var(--lime);
  border: 2px solid var(--lime-shade);
  color: var(--ink);
  font-weight: 600;
  border-radius: 16px;
  padding: 10px 16px;
  text-align: center;
}
.shop-card {
  padding: 16px;
}
.shop-top {
  margin-bottom: 12px;
}
.shelves {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.shelf {
  background: #f6e7ce;
  border-radius: 14px;
  padding: 6px 10px 0;
  border-bottom: 8px solid #b9824a;
}
.shelf.locked {
  opacity: 0.5;
}
.shelf-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.shelf-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: flex-end;
  min-height: 64px;
}
.shelf-bottle {
  position: relative;
}
.shelf-bottle .bottle {
  width: 34px;
  height: 68px;
}
.qty {
  position: absolute;
  right: -6px;
  bottom: 2px;
  font-style: normal;
  font-size: 11px;
  font-weight: 700;
  background: #fff;
  color: var(--ink);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 0 5px;
}
.shelf-empty {
  font-size: 13px;
  opacity: 0.8;
  align-self: center;
  padding-bottom: 8px;
}
.counter {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin-top: 14px;
}
.staff {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.staff .critter {
  width: 70px;
  height: 70px;
}
.bubble,
.speech {
  background: #fff;
  border-radius: 18px;
  padding: 10px 14px;
  color: var(--ink);
  position: relative;
  box-shadow: 0 2px 0 #efe2c8;
}
.bubble small {
  color: var(--ink-soft);
}
.hub-menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.menu-card {
  background: var(--card);
  border-radius: 18px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 3px 0 var(--card-edge);
}
.menu-card b {
  color: var(--ink);
  display: block;
  font-size: 17px;
}
.menu-card small {
  font-size: 13px;
}
.menu-card.primary {
  background: var(--peach);
}
.menu-card.glow {
  outline: 3px solid var(--yellow);
}
.menu-card.dim {
  opacity: 0.65;
}
.menu-row {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
/* ---------- Stock ---------- */
.stock .card {
  margin-top: 10px;
}
.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.tab {
  border: 2px solid #e2d2b4;
  background: #fff;
  color: var(--ink);
  border-radius: 999px;
  padding: 5px 14px;
  font-weight: 600;
  cursor: pointer;
}
.tab.on {
  background: var(--yellow);
  border-color: var(--line);
}
.tab:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.stock-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.stock-card {
  position: relative;
  background: #fff;
  border: 2px solid #efe2c8;
  border-radius: 16px;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}
.stock-card b {
  color: var(--ink);
}
.stock-card small {
  font-size: 12px;
}
.new {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--check);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 1px 8px;
}

/* The rival's shop front: their sign, hand-painted and far too large. */
.rival-sign {
  margin-top: 6px;
  text-align: center;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #7a3b2b;
  background: #f4e2c4;
  border: 2px solid var(--line);
  border-radius: 8px;
  padding: 3px 8px;
  transform: rotate(-1.5deg);
}

/* Why each friend at a table wants what they want. */
.group-why {
  display: block;
  font-style: italic;
  opacity: 0.8;
  font-size: 0.85em;
}

/* A cellar bottle that has finished ageing. */
.stock-card.ready {
  border-color: var(--check);
  box-shadow: 0 0 0 2px rgba(109, 165, 68, 0.25);
}

/* css/serve.css — Session 1–3 styles for this area. build.js concatenates CSS_FILES in order. */
/* ---------- Serve ---------- */
.serve {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 18px;
  align-items: start;
}
.serve-top {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.dots {
  display: flex;
  gap: 6px;
}
.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #d8c5a2;
}
.dot.now {
  background: var(--yellow);
  border-color: var(--line);
}
.dot.perfect {
  background: var(--check);
  border-color: #4c7e2c;
}
.dot.good {
  background: #b6d97f;
  border-color: #7ea84b;
}
.dot.miss,
.dot.skip {
  background: #f1b3a4;
  border-color: var(--red);
}
.customer-card {
  text-align: center;
}
.cust-art {
  padding-bottom: 10px;
}
.face {
  width: 150px;
  height: 150px;
}
.cust-name {
  font-size: 22px;
  margin-bottom: 10px;
}
.speech {
  text-align: left;
  font-size: 17px;
}
.speech.small {
  font-size: 15px;
  margin: 8px 0;
}
.result .grade {
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
}
.result.perfect .grade {
  color: #4c7e2c;
}
.result.miss .grade,
.result.skip .grade {
  color: var(--red);
}
.result p {
  text-align: left;
  font-size: 14px;
  margin: 6px 0;
}
.teach {
  background: var(--check-bg);
  border-radius: 10px;
  padding: 6px 10px;
}
.delta {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.shelf-card h2,
.counter-card h2 {
  font-size: 18px;
  margin-bottom: 10px;
}
.bottle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 10px;
}
.bottle-card {
  position: relative;
  background: #fff;
  border: 2px solid #efe2c8;
  border-radius: 16px;
  padding: 10px 6px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  color: var(--ink);
}
.bottle-card b {
  font-size: 14px;
  margin-top: 4px;
}
.bottle-card .qty {
  top: 8px;
  right: 8px;
  bottom: auto;
}
.bottle-card.sel {
  border-color: var(--line);
  background: #fff3cf;
  box-shadow: 0 3px 0 var(--yellow-shade);
}
.bottle-card:disabled {
  cursor: default;
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.empty {
  opacity: 0.8;
}
.summary-list {
  list-style: none;
  padding: 0;
  margin: 14px 0;
  text-align: left;
  display: grid;
  gap: 8px;
}
.summary-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
}
/* ---------- Lab (mirrors the drink-maker reference) ---------- */
.lab-talk {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.lab-talk .critter {
  width: 64px;
  height: 64px;
  flex: none;
}
.counter-card {
  background: #f2ddb9;
}
.counter-card .card-body {
  background: repeating-linear-gradient(90deg, #efd6ae 0 60px, #f2ddb9 60px 120px);
}
.ing-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.ing {
  background: #fff9ee;
  border: 2px solid #d9be92;
  border-radius: 14px;
  padding: 6px;
  width: 84px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--ink);
  font-size: 12px;
}
.ing.on {
  border-color: var(--line);
  background: #fff0c2;
  box-shadow: 0 3px 0 var(--yellow-shade);
}
.ing .bottle {
  width: 24px;
  height: 48px;
}
.jar {
  width: 40px;
  height: 46px;
}
.mix-zone {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 16px;
  background: #ead3ab;
  border-radius: 18px;
  padding: 14px;
  border: 2px dashed #c9a36e;
}
.mix-glass {
  display: grid;
  place-items: center;
  background: #f7ebd3;
  border-radius: 14px;
}
.mix-glass .glass {
  width: 140px;
  height: 140px;
}
.chosen {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  min-height: 28px;
  margin-bottom: 10px;
}
.pill-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.pill {
  border: 2px solid #d9be92;
  background: #fff;
  color: var(--ink);
  border-radius: 999px;
  padding: 3px 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.pill.on {
  background: var(--yellow);
  border-color: var(--line);
}
.glass-pill .glass {
  width: 22px;
  height: 22px;
}

/* css/book.css — Session 1–3 styles for this area. build.js concatenates CSS_FILES in order. */
/* ---------- Book (encyclopedia) ---------- */
.book-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding-left: 20px;
}
.book-tab {
  border: 2px solid var(--line);
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
  padding: 6px 12px 4px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  background: #f6d9b5;
}
.book-tab.t-overview {
  background: #fff3c4;
}
.book-tab.t-beer {

}
.book-tab.t-cider {

.book-tab.t-wine {

.book-tab.t-fortified {

}
.book-tab.t-spirit {

}
.book-tab.t-liqueur {

}
.book-tab.t-traditional {

.book-tab.t-cocktails {

}
.book-tab.t-curios {

.book {

}

}
.page.right {

}
.page h3 {

.page p {

}
.page-art {

}
.page-art .glass,
.popup .glass {

.pop-art .critter {

.pop-sub {

.note {

}

}
.icon {

}
.lined {

}
.lined li {

}
.linkish {

.book-foot {

}
.recipe {

}
.recipe th {

}
.abv {

}
.abv-row {

}
.abv-bar {

/* css/games.css — Session 1–3 styles for this area. build.js concatenates CSS_FILES in order. */

/* css/v4.css — styles added in Session 4: the decluttered menus, the new
 * screens (office, reviews, report), the new mini-games and animated decor.
 * Concatenated last by build.js (see CSS_FILES), so these win on conflicts. */

/* ---------- Settings that affect the whole page ---------- */
html.text-s {
  font-size: 14px;
}
html.text-l {
  font-size: 19px;
}
html.text-l body,
html.text-l .btn {
  font-size: 1.08em;
}
html.reduce-motion *,
html.reduce-motion *::before {
  animation: none !important;
  transition: none !important;
}

/* ---------- Tap-to-explain popover ---------- */
#tag-pop {
  position: absolute;
  z-index: 70;
  max-width: 260px;
  background: var(--ink);
  color: #fff;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
}
#tag-pop b {
  color: var(--yellow);
  margin-right: 4px;
}
.tag[role='button'] {
  cursor: help;
}

/* ---------- Toast stack ---------- */
#toasts {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  z-index: 60;
  width: min(560px, calc(100% - 24px));
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 9px 18px;
  border-radius: 18px;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
}

/* ---------- Hub: day strip, group tabs, compact shelves ---------- */
.day-strip {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  align-items: center;
  background: var(--card);
  border-radius: 14px;
  padding: 8px 14px;
  box-shadow: 0 3px 0 var(--card-edge);
  font-size: 14px;
  color: var(--ink-soft);
}
.day-strip b {
  color: var(--ink);
}
.day-strip .hot {
  color: var(--red);
  font-weight: 600;
}
.hub-tabs {
  display: flex;
  gap: 6px;
  background: var(--card);
  padding: 5px;
  border-radius: 14px;
  box-shadow: 0 3px 0 var(--card-edge);
}
.hub-tab {
  flex: 1;
  position: relative;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: 10px;
  padding: 7px 4px;
  cursor: pointer;
}
.hub-tab.on {
  background: var(--yellow);
  box-shadow: 0 2px 0 var(--yellow-shade);
}
.dot-note {
  position: absolute;
  top: 4px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
}
.hub-cards {
  display: grid;
  gap: 10px;
}
.hub-cards .menu-card {
  padding: 10px 12px;
}
.menu-card b {
  font-size: 16px;
}
.menu-card small {
  display: block;
  font-size: 12.5px;
  color: var(--ink-soft);
}
.menu-card.primary {
  background: #fff3c4;
  padding: 14px 16px;
}
.menu-card.challenge {
  background: #f3f7e4;
}
.menu-row.system {
  justify-content: center;
  margin-top: 4px;
}
.shelves {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
}
.shelves .shelf {
  padding: 8px 10px 4px;
  margin: 0;
}
.shelves .shelf-items {
  min-height: 46px;
  gap: 2px;
}
.shelves .shelf-bottle .bottle {
  width: 22px;
  height: 44px;
}
.shelf-locked {
  grid-column: 1 / -1;
  margin: 4px 2px 0;
  font-size: 13px;
  color: var(--ink-soft);
}
.shelf-more {
  font-weight: 700;
  color: var(--ink);
  align-self: center;
  padding: 0 6px 8px;
}

/* ---------- Two-level tabs (encyclopedia), sub-tabs, order modes ---------- */
.book-tabs {
  display: block;
  padding-left: 0;
}
.book-groups {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  padding-left: 8px;
  flex-wrap: wrap;
}
.book-subtabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding-left: 20px;
}
.sub-tabs,
.mode-row {
  margin: 4px 0 12px;
  align-items: center;
}
.mode-row small {
  color: var(--ink-soft);
  font-size: 12.5px;
  flex-basis: 100%;
}
.pill.small {
  font-size: 12px;
  padding: 2px 9px;
}

/* ---------- Cards and grids ---------- */
.tech-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.tech {
  background: #fff;
  border: 2px solid #efe2c8;
  border-radius: 14px;
  padding: 10px 12px;

  flex-direction: column;
  gap: 5px;
  align-items: flex-start;
}
.tech b {
  color: var(--ink);
}
.tech small {
  font-size: 13px;
}
.tech.owned {
  background: #eaf3d9;
  border-color: #bbd79a;
}
.tech small,
.stock-card small {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.stock-card {
  padding: 10px 8px;
}
.stock-card b {
  font-size: 14px;
}
.stock-card .decor {
  width: 64px;
  height: 64px;
}
.stock-card.rare {
  background: #fff9e8;
}
.buy-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
.fresh {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #c6ddf0;
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 1px 8px;
  border: 1.5px solid #8fb2d0;
}
.shelf-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: #f6e7ce;
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 8px;
  color: var(--ink);
}

/* ---------- Serve screen ---------- */
.serve-top .dots {
  flex-basis: 100%;
  justify-content: flex-start;
}
.dot b {
  display: none;
  font-size: 9px;
  line-height: 16px;
  color: #fff;
}
html.cb .dot b {
  display: block;
  text-align: center;
}
.dot.refused,
.dot.care {
  background: var(--check);
}
.dot.illegal {
  background: #7a1030;
}
.dot.left {
  background: #bdb2a0;
}
.result.refused,
.result.care {
  background: #eaf3d9;
}
.result.illegal {
  background: #f8d7d0;
}
.result.left {
  background: #f1ece4;
}
html.cb .result.perfect .grade::before {
  content: '✓ ';
}
html.cb .result.good .grade::before {
  content: '~ ';
}
html.cb .result.miss .grade::before {
  content: '✕ ';
}
html.cb .result.skip .grade::before {
  content: '– ';
}
main.serve.t-dusk {
  background: linear-gradient(#fbe7d2, transparent 60%);

}
main.serve.t-night {
  background: linear-gradient(#dad3ee, transparent 60%);
  border-radius: 24px;
}
.customer-card {

}

}
.patience {

}

  display: block;

}

}
.question {

}
.question p {

}
.question .btn {

}
.bottle-card[aria-disabled='true'] {

}
.price {

  color: var(--ink);
}
.star {
  font-size: 13px;
  margin-left: 2px;
}
.star.bronze {
  color: #b8733a;
}
.star.silver {
  color: #9aa0a6;
}
.star.gold {
  color: var(--yellow-shade);
}

/* ---------- ID card ---------- */
.idcard {
  background: #ede3f7;
  border: 3px solid #8e7ab5;
  border-radius: 16px;
  overflow: hidden;
  max-width: 380px;

  box-shadow: 0 4px 0 #b9a8d8;
}
.id-head {
  background: #8e7ab5;

}
.id-body {
  display: flex;
  gap: 12px;
  padding: 10px;
}
.id-photo {

  border: 2px solid #8e7ab5;

.idcard dl {
  margin: 0;

.idcard dd {
  margin: 0;

}
.idcard dd.script {

  font-weight: 400;
  font-size: 16px;
  color: #2b4a8a;
}
.id-foot {
  height: 18px;
  background: repeating-linear-gradient(90deg, #c9b8e6 0 6px, #ede3f7 6px 12px);

/* ---------- Mixer extras ---------- */
.amt {
  font: inherit;
  font-size: 11px;

.stars-row {

.mix-done {

.mix-groups {

}
.ing small {

.glass-pill .glass {

.page.full {

}

}
.mapdot {
  fill: #fff;
  stroke: #8b5a2b;
  stroke-width: 1.5;
  cursor: pointer;
}
.mapdot.on {
  fill: var(--check);
  stroke: #3f6b26;
}
.std-drinks {
  width: 100%;
  max-width: 320px;
}
.pron {
  margin: -4px 0 6px;
  font-size: 13px;
  color: var(--ink-soft);
}
.say {
  width: 30px;
  height: 30px;
  font-size: 14px;
  vertical-align: middle;
}

/* ---------- Mini-games ---------- */
.game-card .card-body {
  text-align: center;
}
.arcade-grid {
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
}
.arcade-grid .tech {
  align-items: center;
  text-align: center;
}
.arcade-grid .tech small {
  -webkit-line-clamp: 1;
}
.game-icon {
  font-size: 28px;
  line-height: 1;
}
.sort-card {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: #fff;
  border: 3px dashed var(--yellow-shade);
  border-radius: 16px;
  padding: 10px 18px;
  margin: 8px auto;
  cursor: grab;
  color: var(--ink);
}
.sort-card .bottle,
.sort-card .glass {
  width: 50px;
  height: 80px;
}
.bins {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.bin {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: #f6e7ce;
  border: 3px solid #d9be92;
  border-radius: 14px;
  padding: 16px 8px;
  cursor: pointer;
}
.bin.over,
.bin:hover {
  background: #fff3c4;
  border-color: var(--yellow-shade);
}
.masked {
  font-size: 24px;
  letter-spacing: 0.15em;
  font-weight: 700;
  color: var(--ink);
}
.bingo {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  max-width: 360px;
  margin: 10px auto;
}
.cell {
  font: inherit;
  background: #fff;
  border: 2px solid #e2d2b4;
  border-radius: 12px;
  padding: 14px 4px;
  color: var(--ink);
  cursor: pointer;
}
.cell.on {
  background: #eaf3d9;
  border-color: var(--check);
  font-weight: 700;
}
.timing {
  position: relative;
  height: 34px;
  background: #f1e4c9;
  border: 2px solid #d9be92;
  border-radius: 999px;
  margin: 14px 0 4px;
  overflow: hidden;
}
.timing .zone {
  position: absolute;
  top: 0;
  bottom: 0;
  background: #bfe0a0;
}
.timing .marker {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 6px;
  margin-left: -3px;
  background: var(--ink);
  border-radius: 3px;
}
.timing.sake {
  background: linear-gradient(90deg, #c6ddf0, #fbe3c8, #f6b8a0);
}
.timing.agave {
  background: linear-gradient(90deg, #e3e07a, #e0a526, #7a2a18);
}
.timing.lagar {
  background: linear-gradient(90deg, #e8d3ee, #b07fc0, #6b3f8f);
}
.timing-scale {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-soft);
}
.stir-pad {
  width: 220px;
  height: 220px;
  margin: 8px auto;
  border-radius: 50%;
  border: 3px dashed var(--yellow-shade);
  display: grid;
  place-items: center;
  touch-action: none;
  position: relative;
}
.stir-pad .glass {
  width: 110px;
  height: 110px;
}
.stir-prog {
  position: absolute;
  bottom: -18px;
  left: 20px;
  right: 20px;
  height: 8px;
  background: #f1e4c9;
  border-radius: 999px;
  overflow: hidden;
}
.stir-prog i {
  display: block;
  height: 100%;
  background: var(--check);
}
.queue {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0;
}
.qcust {
  background: #fff;
  border: 2px solid #e2d2b4;
  border-radius: 12px;
  padding: 6px 10px;
  color: var(--ink);
}
.qcust.now {
  border-color: var(--yellow-shade);
  background: #fff3c4;
  font-weight: 700;
}
.rush-top {
  display: flex;
  gap: 8px;
}
.flashcard {
  background: #fff;
  border: 3px solid #e2d2b4;
  border-radius: 18px;
  padding: 14px;
  max-width: 420px;
  margin: 8px auto;
}
.flashcard.flip {
  border-color: var(--check);
}
.france {
  width: 100%;
  max-width: 360px;
  display: block;
  margin: 0 auto;
}
.region-dot {
  cursor: pointer;
}
.region-dot:hover circle {
  fill: var(--lime);
}
.order-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  min-height: 34px;
  margin: 8px 0;
}
.slot-pick {
  background: #fff3c4;
  border: 2px solid var(--yellow-shade);
  border-radius: 10px;
  padding: 4px 10px;
  font-weight: 600;
  color: var(--ink);
}
.route-map {
  width: min(320px, 100%);
  display: block;
  margin: 8px auto;
}
.tags.big {
  justify-content: center;
  gap: 6px;
}
.tags.big .tag {
  font-size: 14px;
  padding: 5px 12px;
  cursor: pointer;
}

/* ---------- Office, reviews, report, ledger ---------- */
.reviews,
.feed {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 8px;
}
.reviews li {
  background: #fff;
  border: 2px solid #efe2c8;
  border-radius: 12px;
  padding: 8px 10px;
  color: var(--ink);
}
.reviews p {
  margin: 4px 0 0;
  font-style: italic;
}
.reviews small,
.feed small {
  color: var(--ink-soft);
  margin-left: 6px;
}
.feed li {
  border-bottom: 1px dashed #e2d2b4;
  padding: 5px 2px;
  color: var(--ink);
}
.report-table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0;
}
.report-table th {
  text-align: left;
  font-weight: 600;
  color: var(--ink);
  padding: 4px 6px;
  font-size: 14px;
}
.report-table td {
  padding: 4px 6px;
  font-size: 14px;
  color: var(--ink-soft);
  width: 90px;
}
.report-table td:last-child {
  width: auto;
}
.report {
  text-align: left;
  padding-left: 20px;
  margin: 8px 0;
  display: grid;
  gap: 4px;
}
.best {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 6px;
}
.best li {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
}
.best .bottle {
  width: 20px;
  height: 40px;
}
.cert {
  width: 100%;
  max-width: 520px;
  display: block;
  margin: 0 auto;
}
.letter {
  width: 160px;
}

/* ---------- Decor wall + animations (disabled by Reduced motion) ---------- */
.decor-wall {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  background: #f6e7ce;
  border-radius: 14px;
  padding: 6px 10px;
  margin-bottom: 10px;
}
.decor {
  width: 44px;
  height: 44px;
}
.decor-item {
  display: inline-block;
}
@keyframes flicker {
  0%,
  92%,
  100% {
    opacity: 1;
  }
  94% {
    opacity: 0.5;
  }
  96% {
    opacity: 0.9;
  }
}
@keyframes twinkle {
  50% {
    opacity: 0.45;
  }
}
@keyframes sway {
  50% {
    transform: rotate(3deg);
  }
}
@keyframes bob {
  50% {
    transform: translateY(-3px);
  }
}
@keyframes spinY {
  to {
    transform: rotate(360deg);
  }
}
.d-sign svg {
  animation: flicker 4s infinite;
}
.d-lights .bulb {
  animation: twinkle 1.6s infinite;
}
.d-lights .bulb:nth-child(2n) {
  animation-delay: 0.8s;
}
.d-palm svg,
.d-lantern svg {
  transform-origin: 50% 90%;
  animation: sway 3s ease-in-out infinite;
}
.d-hive svg,
.d-jukebox svg {
  animation: bob 1.8s ease-in-out infinite;
}
.d-globe .spin {
  transform-origin: 50px 42px;
  animation: spinY 12s linear infinite;
}
.d-chandelier svg {
  animation: twinkle 3s infinite;
}

/* ---------- Save slots, settings, dev panel, tutorial coach ---------- */
.slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.slot {
  background: #fff;
  border: 2px solid var(--card-edge);
  border-radius: 14px;
  padding: 6px;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
}
.slot.on {
  border-color: var(--yellow-shade);
  background: #fff3c4;
}
.slot small {
  display: block;
  font-size: 11px;
}
textarea {
  width: 100%;
  font: inherit;
  font-size: 12px;
  border: 2px solid var(--card-edge);
  border-radius: 12px;
  padding: 8px;
  background: #fff;
  color: var(--ink);
}
.file-btn {
  cursor: pointer;
}
#settings h3 {
  margin: 12px 0 4px;
  font-size: 15px;
}
#dev-panel {
  position: fixed;
  top: 6px;
  left: 6px;
  z-index: 90;
  background: #2e2a4f;
  color: #fff;
  padding: 6px 8px;
  border-radius: 10px;
  font-size: 12px;
}
#dev-panel input {
  width: 60px;
}
#coach {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 55;
  max-width: 340px;
  background: var(--card);
  border: 3px solid var(--yellow-shade);
  border-radius: 20px;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: 0 4px 0 var(--yellow-shade);
}
#coach .critter {
  width: 56px;
  height: 56px;
  flex: none;
}
#coach p {
  margin: 0;
  color: var(--ink);
  font-size: 14px;
}
.coach-target {
  outline: 4px solid var(--yellow);
  outline-offset: 3px;
  animation: coachPulse 1.2s infinite;
  border-radius: 14px;
}
@keyframes coachPulse {
  50% {
    outline-color: var(--yellow-shade);
  }
}

/* ---------- Shared small bits ---------- */
.center {
  text-align: center;
}
.small {
  font-size: 14px;
}
.neg {
  color: var(--red);
}
.chip.neg {
  border-color: #f0c0b0;
  color: var(--red);
}
.banner.warn {
  background: #fbe3c8;
  border-color: var(--yellow-shade);
  margin-bottom: 12px;
}
.tag.near {
  background: #fbebc0;
  border-color: var(--yellow-shade);
  color: var(--ink);
}
.page h4 {
  color: var(--ink);
  margin: 10px 0 2px;
}
.mission .num {
  position: absolute;
  top: 10px;
  left: 10px;
}

/* ---------- Phones ---------- */
@media (max-width: 700px) {
  .hub-tabs {
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .tech-grid {
    grid-template-columns: 1fr;
  }
  .arcade-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .day-strip {
    font-size: 13px;
  }
  .shelves {
    grid-template-columns: 1fr;
  }
  .region-grid {
    grid-template-columns: 1fr;
  }
  .id-body {
    flex-direction: column;
    align-items: center;
  }
  .slots {
    grid-template-columns: 1fr;
  }
  .shelf-info {
    flex-direction: column;
    align-items: flex-start;
  }
  #coach {
    left: 10px;
    right: 10px;
    top: 76px;
    bottom: auto;
    max-width: none;
    padding: 6px 10px;
  }
  #coach .critter {
    width: 40px;
    height: 40px;
  }
  #coach p {
    font-size: 13px;
  }
}

@media print {
  body * {
    visibility: hidden;
  }
  #certificate,
  #certificate *,
  #report,
  #report * {
    visibility: visible;
  }
  #certificate,
  #report {
    position: absolute;
    left: 0;
    top: 0;
  }
}

/* An "empty" message inside a grid should span the whole row, not one column. */
.stock-grid .empty,
.tech-grid .empty,
.card-grid .empty,
.bottle-grid .empty {
  grid-column: 1 / -1;
}

/* Arcade tiles: let the short reward/lock lines wrap instead of clipping. */
.arcade-grid .tech small {
  -webkit-line-clamp: 2;
  text-align: center;
}

stroke-width="2.5"/>'}};function Bt(e,a){var r=a||"#F8C94E",i="#6E3B1F",s=It[e],o=s?s(r,i):'<circle cx="50" cy="50" r="30" fill="'+r+'" stroke="'+i+'" stroke-width="3"/>';return'<svg class="decor" viewBox="0 0 100 100" aria-hidden="true">'+o+"</svg>"}var z={SAVE_KEY:Va,AGE_KEY:Wa,SAVE_VERSION:Ua,START_COINS:Ka,START_STOCK:Ja,EXPRESS_MARKUP:Xa,BULK_QTY:Za,BULK_DISCOUNT:Qa,MAX_MIX:$a,CATS:et,CAT_ORDER:at,FLAT_OVERNIGHT:tt,TAGS:rt,TAG_NEIGHBORS:it,COLORS:ze,PERSONAS:nt,OCCASIONS:st,REACTIONS:ot,CHAPTERS:lt,MIXER_GROUPS:ct,MIXERS:ut,METHODS:dt,GLASSES:ht,FAMILIES:mt,ERAS:gt,STAFF:pt,CRITTER_COLORS:xt,esc:ft,aOrAn:bt,hashStr:Le,sellPrice:Ge,parseItems:yt,parseRecipes:vt,strengthLabel:wt,mixColor:St,hexToRgb:He,chroma:H,bottleSVG:Et,faceSVG:_t,critterSVG:Ct,glassSVG:Rt,jarSVG:Tt,decorSVG:Bt};var Ye=[{id:"abv",group:"basics",rule:"ch:1",name:"ABV",text:"Alcohol By Volume. 5% ABV means about 5% of the liquid is alcohol. Beer is often around 5%, wine 12\u201314%, spirits around 40%."},{id:"fermentation",group:"production",rule:"ch:1",name:"Fermentation",text:"Yeast eats sugar from grain, grapes, fruit or honey and turns it into alcohol and bubbles. Beer, cider, mead and wine are all fermented."},{id:"care",group:"safety",rule:"ch:1",name:"Drinking with care",text:"Alcohol affects everyone differently. Pace yourself, eat, drink water, and never drive after drinking. Some people shouldn't drink at all."},{id:"legal_age",group:"safety",rule:"ch:1",name:"Legal age",text:"The legal drinking age is different in every country, commonly 18 to 21. Shops must check ID."},{id:"standard_drink",group:"safety",rule:"ch:2",name:"Standard drink",text:"A small beer, a glass of wine and a single shot of spirit contain roughly the same alcohol. Strength and pour size balance out."},{id:"fruit_wine",group:"culture",rule:"ch:2",name:"Wine without grapes",text:'"Wine" can be made from almost any fruit, or honey. Cider, perry, mead and fruit wines are all fermented the same basic way.'},{id:"carbonation",group:"production",rule:"ch:2",name:"Bubbles",text:"Bubbles are carbon dioxide from fermentation. Trap it in a sealed bottle or tank and the drink sparkles."},{id:"sparkling",group:"culture",rule:"ch:3",name:"Champagne vs sparkling",text:"All Champagne is sparkling wine, but not all sparkling wine is Champagne. The name belongs to one region of France."},{id:"tannin",group:"sensory",rule:"ch:3",name:"Tannin",text:"The drying, grippy feeling from grape skins, seeds and oak. Strong black tea has it too."},{id:"terroir",group:"culture",rule:"ch:3",name:"Terroir",text:"The idea that soil, climate and place shape a wine's flavor. That's why many wines are named after regions, not grapes."},{id:"dry_sweet",group:"sensory",rule:"ch:3",name:"Dry vs sweet",text:'"Dry" just means little sugar is left. A wine can be dry and still taste fruity.'},{id:"fortification",group:"production",rule:"ch:4",name:"Fortification",text:"Adding spirit to wine. Added early, it keeps the wine sweet (port); added after, the wine stays dry (fino sherry)."},{id:"vermouth_wine",group:"culture",rule:"ch:4",name:"Vermouth is wine!",text:"Vermouth is fortified wine flavored with herbs and spices. That's why an opened bottle belongs in the fridge."},{id:"distillation",group:"production",rule:"ch:5",name:"Distillation",text:"Heating a fermented liquid and collecting the vapor concentrates the alcohol. That's how spirits reach around 40%."},{id:"aging",group:"production",rule:"ch:5",name:"Ageing",text:"Oak barrels add color, vanilla and spice, and slowly soften harsh flavors. Spirits stop ageing once bottled."},{id:"blending",group:"production",rule:"ch:5",name:"Blending",text:"Most whiskies, rums and brandies are blends of many barrels, mixed for a consistent taste."},{id:"filtration",group:"production",rule:"item:vodka",name:"Filtration",text:"Passing spirit through charcoal or other filters removes flavors, making it cleaner."},{id:"serving_size",group:"safety",rule:"ch:5",name:"Serving size",text:"Strength isn't the same as how much you drink. A spirit is served in a much smaller pour than a pint of beer."},{id:"proof",group:"culture",rule:"ch:5",name:"Proof vs ABV",text:'In the US, "proof" is double the ABV: 80 proof means 40% ABV.'},{id:"liqueur",group:"basics",rule:"ch:6",name:"Liqueur vs liquor",text:'A liqueur is spirit with added sugar and flavor, usually 15\u201330%. "Liquor" just means any spirit.'},{id:"infusion",group:"production",rule:"ch:6",name:"Infusion",text:"Soaking herbs, fruit or spices in alcohol to pull out their flavor. Limoncello and sloe gin are infusions."},{id:"modifier",group:"basics",rule:"ch:6",name:"Modifier",text:"Something added to a base spirit to change its flavor: vermouth, a liqueur or bitters."},{id:"schnapps",group:"culture",rule:"item:peach_schnapps",name:"Schnapps, two meanings",text:"In Germany, schnapps is a strong, unsweetened fruit spirit. In the US it's a sweet liqueur."},{id:"shake_stir",group:"basics",rule:"ch:7",name:"Shake vs stir",text:"Shake drinks with juice, cream or egg to mix and aerate them. Stir all-spirit drinks to chill them while keeping them silky."},{id:"build_blend",group:"basics",rule:"ch:7",name:"Build, muddle, blend",text:"Build: pour straight into the glass. Muddle: gently press fruit or herbs. Blend: whizz with ice."},{id:"families",group:"basics",rule:"cocktails:5",name:"Cocktail families",text:"Most cocktails follow a few patterns: sours (spirit + citrus + sweet), highballs (spirit + mixer) and stirred drinks (spirit + modifier)."},{id:"club_drinks",group:"culture",rule:"family:shot",name:`"Club drink" isn't a category`,text:"Club drinks are about where and how drinks are served, not how they're made. Many are sweet and hide lots of alcohol."},{id:"neat",group:"serving",rule:"ch:5",name:"Neat",text:"Served at room temperature with nothing added. Common for fine whisky and brandy."},{id:"on_rocks",group:"serving",rule:"ch:5",name:"On the rocks",text:"Poured over ice cubes in a short glass."},{id:"up",group:"serving",rule:"ch:7",name:"Up",text:"Shaken or stirred with ice, then strained into a stemmed glass without ice."},{id:"chilled",group:"serving",rule:"ch:3",name:"Chilled",text:"White, ros\xE9 and sparkling wines are served cold; most reds just below room temperature."},{id:"with_mixer",group:"serving",rule:"ch:5",name:"With soda or tonic",text:"A spirit topped with a fizzy mixer: the simplest drink there is."},{id:"highball_serve",group:"serving",rule:"glass:highball",name:"Highball",text:"A tall glass of spirit and mixer over ice."},{id:"lowball",group:"serving",rule:"glass:rocks",name:"Lowball",text:"A short, wide glass for spirits over ice or strong stirred drinks."},{id:"shot",group:"serving",rule:"glass:shot",name:"Shot",text:"A small single pour meant to be drunk quickly. Tasting slowly is usually more fun."},{id:"flight",group:"serving",rule:"ch:9",name:"Flight",text:"Several small tastes side by side, to compare styles."},{id:"ice_cubes",group:"ice",rule:"ch:7",name:"Cubes",text:"Standard ice for shaking, stirring and most glasses."},{id:"ice_crushed",group:"ice",rule:"family:julep",name:"Crushed ice",text:"Chills fast and dilutes fast. Perfect for juleps and swizzles."},{id:"ice_pebble",group:"ice",rule:"family:tiki",name:"Pebble ice",text:"Small, chewable nuggets beloved by tiki bars."},{id:"ice_nugget",group:"ice",rule:"family:punch",name:"Nugget ice",text:"Soft, porous ice that soaks up flavor. Many swizzles use it."},{id:"ice_spear",group:"ice",rule:"glass:collins",name:"Collins spear",text:"A long stick of ice that fits a tall Collins glass perfectly."},{id:"ice_large",group:"ice",rule:"tech:large_ice",name:"Large cube",text:"One big cube melts slowly, keeping a strong drink cold without watering it down."},{id:"ice_sphere",group:"ice",rule:"tech:large_ice",name:"Ice sphere",text:"The shape with the least surface area, so it melts the slowest."},{id:"pair_cheese",group:"pairing",rule:"ch:3",name:"Cheese",text:"Salty cheese loves sweet wine: blue cheese with port or Sauternes is a classic."},{id:"pair_chocolate",group:"pairing",rule:"ch:4",name:"Chocolate",text:"Rich fortified wines like PX and tawny port stand up to dark chocolate."},{id:"pair_seafood",group:"pairing",rule:"ch:3",name:"Seafood",text:"Crisp whites, dry sherry and sake suit fish and shellfish."},{id:"pair_steak",group:"pairing",rule:"ch:3",name:"Steak",text:"Tannic reds like Malbec and Bordeaux cut through fatty meat."},{id:"pair_spicy",group:"pairing",rule:"ch:2",name:"Spicy food",text:"Cold, lower-alcohol drinks calm spice. High alcohol makes chili feel hotter."},{id:"pair_dessert",group:"pairing",rule:"ch:6",name:"Dessert",text:"The drink should be at least as sweet as the dessert, or it tastes sour."},{id:"pair_fruit",group:"pairing",rule:"ch:2",name:"Fruit",text:"Light, fruity drinks and sparkling wines echo fresh fruit."},{id:"pair_cured",group:"pairing",rule:"ch:4",name:"Cured meat",text:"Dry fino sherry with ham is a Spanish classic: salty meets salty."},{id:"appellation",group:"culture",rule:"ch:9",name:"Protected names",text:"Some names are tied to places: Champagne, Cognac and Tequila can only come from their home regions."},{id:"methanol",group:"safety",rule:"item:arak_bali",name:"Unlicensed spirits",text:"Badly made home-distilled spirit can contain methanol, which is poisonous. Only buy licensed, labeled bottles."},{id:"moonshine",group:"culture",rule:"item:corn_whiskey",name:"Moonshine",text:'Spirit made secretly, often by moonlight to avoid tax officers. Legal "moonshine" today is unaged corn whiskey.'},{id:"label_brut",group:"labels",rule:"item:champagne",name:"Brut and friends",text:"Sparkling wine sweetness words: Brut Nature (driest), Extra Brut, Brut, Extra Dry, Dry, Demi-Sec, Doux (sweetest)."},{id:"label_age",group:"labels",rule:"item:cognac",name:"VS, VSOP, XO",text:"Brandy age grades: VS is at least 2 years old, VSOP at least 4, XO at least 10."},{id:"label_single_malt",group:"labels",rule:"item:speyside",name:"Single malt",text:'Malt whisky from a single distillery. "Single" means one distillery, not one barrel.'},{id:"label_anejo",group:"labels",rule:"item:tequila",name:"Blanco, Reposado, A\xF1ejo",text:'Tequila ageing words: unaged, "rested" 2\u201312 months, and aged 1\u20133 years.'},{id:"label_junmai",group:"labels",rule:"item:sake",name:"Junmai",text:"Sake made only from rice, water, yeast and koji, with no added alcohol."},{id:"koji",group:"production",rule:"base:rice",name:"Koji",text:"A helpful mold that turns rice starch into sugar so yeast can ferment it. Key to sake, shochu and soy sauce."},{id:"ing_grain",group:"ingredients",rule:"base:grain",name:"Grain",text:"Barley, wheat, corn, rye, sorghum and millet. Grain starch must be turned into sugar (malting) before yeast can use it."},{id:"ing_grapes",group:"ingredients",rule:"base:grape",name:"Grapes",text:"Grapes have natural sugar and yeast on their skins, which is why wine was probably discovered by accident."},{id:"ing_fruit",group:"ingredients",rule:"base:fruit",name:"Fruit",text:"Apples, pears, cherries, plums and more can be fermented into wine or distilled into brandy."},{id:"ing_honey",group:"ingredients",rule:"base:honey",name:"Honey",text:"Honey diluted with water ferments into mead. Undiluted honey is too sugary for yeast."},{id:"ing_cane",group:"ingredients",rule:"base:sugarcane",name:"Sugarcane",text:"Rum and cacha\xE7a come from cane. Molasses is the syrupy leftover of sugar making."},{id:"ing_agave",group:"ingredients",rule:"base:agave",name:"Agave",text:"A spiky plant whose heart is roasted to turn its starch into sugar. Takes years to grow."},{id:"ing_rice",group:"ingredients",rule:"base:rice",name:"Rice",text:"Rice has no sugar, so Asian brewers use koji or starter cakes to convert its starch."},{id:"ing_palm",group:"ingredients",rule:"base:palm",name:"Palm sap",text:"Sweet sap from coconut and other palms starts fermenting on its own within hours."},{id:"ing_milk",group:"ingredients",rule:"base:milk",name:"Milk",text:"Mare's milk has more sugar than cow's milk, enough to ferment into kumis."},{id:"ing_potato",group:"ingredients",rule:"base:potato",name:"Potatoes",text:"Some vodkas and aquavits are made from potatoes, which need their starch converted like grain."},{id:"ing_botanicals",group:"ingredients",rule:"base:botanicals",name:"Botanicals",text:"Herbs, roots, seeds, peels and flowers used to flavor gin, amari and liqueurs."},{id:"ing_nut",group:"ingredients",rule:"base:nut",name:"Nuts",text:"Almonds, hazelnuts and walnuts flavor liqueurs like amaretto, Frangelico and nocino."},{id:"ing_plant",group:"ingredients",rule:"base:plant",name:"Other plants",text:"Coffee, cocoa, flowers, desert plants and resin can all become drinks."},{id:"taste_sour",group:"sensory",rule:"tag:sour",name:"Sour",text:"Tartness from acids like citric (lemon) or lactic (yogurt, sour beer)."},{id:"taste_bitter",group:"sensory",rule:"tag:bitter",name:"Bitter",text:"From hops, roots, peels and quinine. Many cultures drink bitters before or after meals."},{id:"taste_salty",group:"sensory",rule:"tag:salty",name:"Salty",text:"A pinch of salt makes sweet and sour flavors pop. Try gose or manzanilla."},{id:"taste_umami",group:"sensory",rule:"item:shaoxing",name:"Umami",text:"A savory, brothy taste. Aged sake, sherry and Shaoxing wine have it."},{id:"taste_fruity",group:"sensory",rule:"tag:fruity",name:"Fruity",text:"Fruit smells often come from yeast, not fruit: wheat beer smells of banana with none inside."},{id:"taste_floral",group:"sensory",rule:"tag:floral",name:"Floral",text:"Flower aromas from grapes like Torront\xE9s, from hops, or from added petals."},{id:"taste_herbal",group:"sensory",rule:"tag:herbal",name:"Herbal",text:"Green, leafy flavors from herbs and botanicals."},{id:"taste_spicy",group:"sensory",rule:"tag:spicy",name:"Spicy",text:"Pepper, clove, cinnamon or ginger: from yeast, grain like rye, or added spices."},{id:"taste_smoky",group:"sensory",rule:"tag:smoky",name:"Smoky",text:"From peat-dried barley, roasted agave or charred barrels."},{id:"taste_oaky",group:"sensory",rule:"ch:5",name:"Oaky",text:"Vanilla, toast and coconut flavors from oak barrels."},{id:"taste_nutty",group:"sensory",rule:"tag:nutty",name:"Nutty",text:"From ageing with air (oloroso, tawny port) or actual nuts in liqueurs."},{id:"zero_proof",group:"safety",rule:"ch:1",name:"Alcohol-free options",text:`"Alcohol-free" usually means 0.5% ABV or less. Keep some on the shelf for drivers and anyone who isn't drinking.`},{id:"id_check",group:"safety",rule:"ch:1",name:"Checking ID",text:"Compare the date of birth with today's date, then look for mismatched fonts, handwriting, odd spacing, wrong date formats, an expired card, or a photo that doesn't match."},{id:"over_serving",group:"safety",rule:"ch:2",name:"Over-serving",text:"If a customer is clearly tipsy, don't sell them more alcohol. Offer water or an alcohol-free drink instead."},{id:"label_reserva",group:"labels",rule:"ch:3",name:"Reserva & Gran Reserva",text:"Spanish ageing words. For red Rioja, Reserva means at least 3 years of ageing (1 in oak); Gran Reserva at least 5 (2 in oak)."},{id:"label_trocken",group:"labels",rule:"item:riesling",name:"Trocken & Halbtrocken",text:"German label words: trocken means dry, halbtrocken means off-dry."},{id:"label_aoc",group:"labels",rule:"ch:3",name:"AOC, DOC, DO",text:"Protected-origin labels in France (AOC), Italy (DOC, DOCG) and Spain (DO) with rules about where and how the wine is made."},{id:"label_ginjo",group:"labels",rule:"item:sake",name:"Ginjo & Daiginjo",text:"Sake from rice polished down to at least 60% (ginjo) or 50% (daiginjo) of its size: more fragrant and delicate."},{id:"label_cask",group:"labels",rule:"item:whisky",name:"Cask strength",text:"Whisky bottled straight from the cask without adding water, often 55\u201365% ABV."},{id:"garnishes",group:"serving",rule:"ch:7",name:"Garnishes",text:"A garnish is the first impression: citrus-peel oil ive. Dried fruit often has more sulfites than wine."],["You can sober up with a cold shower.",!1,"Nothing speeds it up: the liver clears alcohol at its own pace."],["Cognac is a kind of brandy.",!0,"Cognac is brandy from one region of France."],["Sake should always be served hot.",!1,"Many premium sakes are best chilled; everyday sakes can be warmed."],["Port comes from Portugal.",!0,"It is named after the city of Porto."],["Liqueur and liquor mean the same thing.",!1,"Liqueurs are sweetened and flavored; liquor means any spirit."],["The worm in mezcal is a real larva.",!0,"It is a moth larva added by some brands as a gimmick."],["Screw-cap wine can't age.",!1,"Studies show wine can age well under screw caps too."],["Beer is always brewed from barley.",!1,"Wheat, rice, sorghum, corn and more are used around the world."],["Alcohol-free beer is always exactly 0%.",!1,"Many contain up to 0.5%, about the same as ripe fruit juice."],['A "dram" is a Scottish word for a small whisky pour.',!0,"Originally an old unit of weight; now just a friendly measure."],["Cider can be sparkling or still.",!0,"Both are traditional, depending on the region."],["Drinking water between drinks makes no difference.",!1,"It slows you down and keeps you hydrated. It helps."]],SPECS:{martini:{gin:60,dry_vermouth:10},negroni:{gin:30,sweet_vermouth:30,campari:30},manhattan:{rye:50,bourbon:50,sweet_vermouth:25},daiquiri:{rum:60,lime:25,sugar:15},margarita:{tequila:50,triple_sec:20,lime:25},whiskey_sour:{bourbon:50,rye:50,whisky:50,irish_whiskey:50,lemon:25,sugar:20},old_fashioned:{bourbon:60,rye:60,whisky:60,sugar:10},espresso_martini:{vodka:50,coffee_liqueur:20},gin_tonic:{gin:50},aperol_spritz:{aperol:60},last_word:{gin:22,chartreuse:22,maraschino:22,lime:22},paper_plane:{bourbon:22,aperol:22,amaro:22,lemon:22},mai_tai:{rum:60,lime:25,triple_sec:15,orgeat:15,sugar:10},bees_knees:{gin:60,lemon:20,honey_syrup:20},vesper:{gin:60,vodka:15,lillet:10},caipirinha:{cachaca:60,lime:30,sugar:15},sidecar:{
