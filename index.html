,"Wed","Thu","Fri","Sat","Sun"],MONTHS:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],SEASONS:{spring:{name:"Spring",tags:["floral","light","fruity"],customers:0,budget:1,fans:["mina","hana"]},summer:{name:"Summer",tags:["refreshing","sparkling","citrus"],customers:1,budget:1,fans:["rico","sam"]},autumn:{name:"Autumn",tags:["rich","nutty","earthy"],customers:0,budget:1.05,fans:["ivy","ken"]},winter:{name:"Winter",tags:["rich","strong","spicy"],customers:-1,budget:1.15,fans:["otto","leo","colette"]}},FESTIVALS:[{id:"new_year",name:"New Year",m:1,d:1,len:1,tags:["sparkling"],text:"Sparkling rush! Everyone wants bubbles."},{id:"burns",name:"Burns Night",m:1,d:25,len:1,cats:["spirit"],tags:["smoky"],text:"Scotland's poet is toasted with whisky."},{id:"valentines",name:"Valentine's Day",m:2,d:14,len:1,tags:["sparkling","sweet","floral"],text:"Date-night drinks everywhere."},{id:"st_patricks",name:"St Patrick's Day",m:3,d:17,len:1,tags:["rich"],cats:["beer"],text:"Stout and Irish drinks fly off the shelf."},{id:"vappu",name:"Vappu (May Day)",m:5,d:1,len:1,tags:["sparkling","citrus"],text:"Finns celebrate spring with sima and bubbles."},{id:"tiki",name:"Tiki Night",weekday:4,months:[6,7,8],tags:["fruity","sweet"],text:"Summer Fridays go tropical."},{id:"sake_day",name:"Sake Day",m:10,d:1,len:1,cats:["traditional"],text:"1 October is Nihonshu no Hi, Japan's sake day."},{id:"oktoberfest",name:"Oktoberfest",m:9,d:19,len:16,cats:["beer"],text:"Munich-style beer days!"},{id:"christmas",name:"Christmas week",m:12,d:20,len:7,tags:["spicy","rich","sweet"],text:"Mulled wine, port and cozy spice."}],DAILY_EVENTS:{critic:{name:"A food critic is in town",text:"One customer is a critic: a perfect match is worth +5 reputation, a miss costs 5."},celebrity:{name:"Celebrity sighting!",text:"A celebrity will drop by with a big budget."},power_cut:{name:"Power cut",text:"No fridge, no ice: no cocktail orders and the lab is closed today."},tour_bus:{name:"Tour bus!",text:"A busload of tourists arrives: extra customers today."}}};var Ze={STORY_INTRO:[{title:"A letter arrives",text:"Dear {owner}, if you're reading this, I've finally retired to the seaside. I'm leaving you my little bottle shop."},{title:"The shop",text:"It's small and a bit dusty. Mochi the cat came with the building, Momo tends the counter, and Bruno the bear knows his wine (and won't stop telling you)."},{title:"Aunt Rosie's rules",text:"I never cared whether people drank. I cared that I listened. Learn what people like, sell kindly, check IDs, and never let anyone drive after a drink. Love, Aunt Rosie. P.S. Rent is due every night. Sorry!"}],CHAPTER_STORY:['A postcard from Aunt Rosie: "Heard the beer shelf is humming. Next, the orchard!"','Buzz the bee has been spotted near the mead. Aunt Rosie: "Honey was my first love."',"Bruno finally smiled at your wine shelf. Almost.",`Aunt Rosie: "Vermouth is wine. I told you so, years ago. You didn't listen."`,`The distillers down the road nod at you now. You're officially "the shop that knows".`,'Momo stuck a sign on the liqueur cabinet: "Sweet things live here".',"The Cocktail counter hums. Customers start bringing friends.","Travelers stop by, asking for tastes of home. You usually have one.",'A collector leaves a card: "Call me when you find something rare."',"Aunt Rosie is coming to visit\u2026"],STORY_ENDING:[{title:"A visitor",text:"The bell rings. It's Aunt Rosie, sunburned and smiling, with Buzz perched on her hat."},{title:"The tour",text:"She walks every shelf, asks Momo for a Negroni, Bruno for a glass of tawny, and checks your ID (as a joke)."},{title:"The shop is yours",text:`"You listened, {owner}. That's the whole secret." She leaves a framed certificate on the counter.`}]};var Qe={ROSIE_LETTERS:[{id:"first_week",at:3,subject:"How is the shop?",body:"Dear {owner}, the first week is the hardest. Listen more than you talk, and keep a little money back for the rent. Love, Rosie.",reply:{prompt:"Write back?",options:[{id:"honest",label:"Tell her it's hard",trust:2,back:'Rosie writes straight back: "Good. Anyone who says week one was easy is selling something."'},{id:"brave",label:"Tell her it's going well",trust:0,back:'Rosie writes back: "Mm. Write again when you want to tell me the true version."'}]}},{id:"shelves",at:8,subject:"A note about shelves",body:"I hear you have more than beer now. Good. Put the things you believe in at eye height, {owner}. People buy what they can see."},{id:"regulars",at:15,subject:"On regulars",body:"A regular is worth ten strangers. Remember what they liked, ask how it went, and they will bring their friends.",reply:{prompt:"Write back?",options:[{id:"names",label:"Say you learned their names",trust:3,back:'Rosie: "Names first, then favourites. You are further along than I was."'},{id:"busy",label:"Say you've been too busy",trust:-1,back:'Rosie: "Too busy for the people who pay the rent? Make time, love."'}]}},{id:"saying_no",at:22,subject:"On saying no",body:"You will have to refuse someone sooner or later. Do it kindly and do it anyway. The town is watching, and it remembers."},{id:"cellar",at:30,subject:"The cellar",body:"Put something away that you cannot sell today. Patience is the cheapest ingredient there is."},{id:"competition",at:40,subject:"Competition",body:"Another shop? Good. Do not copy them, {owner}. Be the place that knows things."},{id:"proud",at:55,subject:"Proud of you",body:"I looked you up in the town paper. My little shop, in the paper! Keep going. I will visit when the sea gets cold."},{id:"accounts",at:70,subject:"A word about the books",body:"Your uncle ran this place on instinct and nearly lost it twice. Read your ledger on a Sunday, {owner}, even when it is dull. Especially when it is dull."},{id:"quiet_years",at:90,subject:"The quiet years",body:"There will be weeks where nothing happens and you wonder if you have wasted your life on bottles. Those are the weeks the shop is actually being built."},{id:"first_rare",on:"first_rare",subject:"You found one!",body:"A rare bottle, in your shop. I am not jealous. I am delighted. I am mostly delighted. Do not open it to impress anyone, {owner}."},{id:"lost_contract",on:"contract_lost",subject:"About that contract",body:"You missed a delivery. It happens, and it will happen again. Write the deadline where you will see it, apologise once, and do not grovel.",reply:{prompt:"Write back?",options:[{id:"own",label:"Own it",trust:3,back:'Rosie: "Good. Owning it is the whole apology. The rest is decoration."'},{id:"blame",label:"Blame the supplier",trust:-2,back:'Rosie: "The supplier did not accept the contract, love. You did."'}]}},{id:"category_100",on:"category_100",subject:"You learned a whole shelf",body:"Every bottle in a category, start to finish. Your uncle never managed that. I am telling everyone at the bowls club."},{id:"first_loan",on:"first_loan",subject:"About the loan",body:"Borrowed money is a tool, not a disgrace. Pay it on the night it is due and it stays a tool. Miss it twice and it becomes a landlord."},{id:"first_complaint",on:"first_complaint",subject:"Someone came back",body:"A customer returned a bottle. Do not take it personally and do not argue. Put it right, and they will tell more people about the fixing than the mistake."},{id:"rival_ahead",on:"rival_ahead",subject:"Griff",body:"I knew Griff's father. Same chalkboard, same shouting. Undercutting is not a plan, {owner}, it is a countdown. Outlast him.",reply:{prompt:"Write back?",options:[{id:"wait",label:"Say you'll outlast him",trust:2,back:'Rosie: "That is the answer. Now go and stock something he cannot pronounce."'},{id:"cut",label:"Say you'll cut prices too",trust:-2,back:'Rosie: "Then you are both in the countdown. Think again."'}]}},{id:"trusted",on:"trust_high",subject:"The town talks",body:"Someone at the market told me your shop is the one that tells you the truth about what you are buying. That is the whole job, {owner}. That is it."},{id:"first_trip",on:"first_trip",subject:"You went somewhere!",body:"A passport stamp and a souvenir. Go to the places the drinks come from whenever you can afford the day. Nothing in a book beats standing in the field."},{id:"after_honest",on:"reply:first_week:honest",subject:"Since you told me the truth",body:"You said the first week was hard, so here is the thing nobody told me: the shop does not get easier, {owner}. You get better at it. Those feel identical from the inside and they are not the same at all."},{id:"after_brave",on:"reply:first_week:brave",subject:'I know what "going well" means',body:"You wrote that it was going well. I ran a shop for thirty years, love. Write again when you want to tell me the other version \u2014 I promise not to say I told you so more than once."},{id:"after_names",on:"reply:regulars:names",subject:"Names, and then what?",body:"You learned their names. Good. Now learn one thing each that has nothing to do with drink \u2014 a job, a dog, a bad knee. That is the part that keeps them coming when someone opens up cheaper down the road."},{id:"after_busy",on:"reply:regulars:busy",subject:"About being too busy",body:"I have thought about your last letter. Being too busy for your regulars is a stocktaking problem, not a people problem. Fix the stocktaking, {owner}."},{id:"after_own",on:"reply:lost_contract:own",subject:"You owned it",body:"The venue told me you apologised once and then just fixed it. That is a reputation, and you built it out of a mistake. Most people never manage that trick."},{id:"after_blame",on:"reply:lost_contract:blame",subject:"One more word on the contract",body:"You blamed the supplier. Perhaps you were right. It still changes nothing about the delivery that did not arrive, and the venue is not writing to your supplier, {owner}. They are writing to you."},{id:"after_wait",on:"reply:rival_ahead:wait",subject:"Outlasting Griff",body:"Good answer about Griff. Outlasting is not sitting still, mind. It is being somewhere he cannot follow: the bottle nobody else stocks, the thing you can explain and he cannot."},{id:"after_cut",on:"reply:rival_ahead:cut",subject:"Please do not cut",body:"You said you would drop your prices to match his. I will say this once, {owner}: the shop that wins a price war is the one with the deepest pockets, and it is never the small one."}]};var M=Object.assign({},Ve,We,Ue,Ke,Je,Xe,Ze,Qe);var $e=[{id:"lager",name:"Lager",cat:"beer",abv:5,abvRange:"4\u20135.5",country:"Germany",base:"grain",tags:["light","refreshing"],shape:"beer",color:"gold",buy:4,fact:"Brewed with yeast that works at cool temperatures, giving a clean, crisp taste. Most of the world's beer is lager."},{id:"pilsner",name:"Pilsner",cat:"beer",abv:4.8,abvRange:"4.2\u20135.5",country:"Czech Republic",base:"grain",tags:["light","bitter","refreshing"],shape:"beer",color:"green",buy:4,fact:"First brewed in the Czech city of Plze\u0148 in 1842. A pale lager with a noticeable hop bitterness."},{id:"helles",name:"Helles",cat:"beer",abv:4.9,abvRange:"4.5\u20135.5",country:"Germany",base:"grain",tags:["light","refreshing"],shape:"beer",color:"straw",buy:4,fact:"Munich's everyday golden lager: softer and less bitter than a pilsner."},{id:"wheat",name:"Wheat Beer",cat:"beer",abv:5.2,abvRange:"4.5\u20135.5",country:"Germany",base:"grain",tags:["light","fruity","refreshing"],shape:"beer",color:"orange",buy:5,fact:"Brewed with lots of malted wheat. Hefeweizen yeast gives banana and clove aromas, with no fruit added."},{id:"kolsch",name:"K\xF6lsch",cat:"beer",abv:4.8,abvRange:"4.4\u20135.2",country:"Germany",base:"grain",tags:["light","refreshing","fruity"],shape:"beer",color:"straw",buy:5,fact:"From Cologne: brewed with ale yeast, then cold-stored like a lager. Served in small straight glasses."},{id:"marzen",name:"M\xE4rzen",cat:"beer",abv:5.8,abvRange:"5.5\u20136.5",country:"Germany",base:"grain",tags:["rich","sweet"],shape:"beer",color:"amber",buy:5,fact:'"March beer": brewed in spring and stored through base:"grain",tags:["creamy","sweet","rich"],shape:"beer",color:"dark",buy:6,fact:"Brewed with lactose, a milk sugar yeast can't eat, so it stays sweet and creamy."},{id:"imperial_stout",name:"Imperial Stout",cat:"beer",abv:10,abvRange:"8\u201312",country:"England",base:"grain",tags:["rich","strong","bitter"],shape:"beer",color:"black",buy:8,fact:"Brewed extra-strong in the 1700s for export to the Russian imperial court."},{id:"scotch_ale",name:"Scotch Ale",cat:"beer",abv:8,abvRange:"6.5\u201310",country:"Scotland",base:"grain",tags:["rich","sweet","strong"],shape:"beer",color:"brown",buy:7,fact:'Also called "wee heavy": a very malty, caramel-rich strong ale.'},{id:"barleywine",name:"Barleywine",cat:"beer",abv:10,abvRange:"8\u201312",country:"England",base:"grain",tags:["strong","rich","sweet"],shape:"beer",color:"copper",buy:8,fact:"A beer as strong as wine. Some are aged for years like fine spirits."},{id:"witbier",name:"Witbier",cat:"beer",abv:5,abvRange:"4.5\u20135.5",country:"Belgium",base:"grain",tags:["light","citrus","spicy"],shape:"beer",color:"straw",buy:5,fact:"Cloudy Belgian wheat beer spiced with orange peel and coriander."},{id:"saison",name:"Saison",cat:"beer",abv:6.5,abvRange:"5\u20137.5",country:"Belgium",base:"grain",tags:["dry","spicy","refreshing"],shape:"beer",color:"straw",buy:6,fact:"Once brewed on farms for summer workers. Dry, peppery and lively."},{id:"dubbel",name:"Dubbel",cat:"beer",abv:7,abvRange:"6\u20137.6",country:"Belgium",base:"grain",tags:["rich","fruity","sweet"],shape:"beer",color:"brown",buy:6,fact:"Monastery-style dark ale with raisin and caramel flavors."},{id:"tripel",name:"Tripel",cat:"beer",abv:8.5,abvRange:"7.5\u20139.5",country:"Belgium",base:"grain",tags:["fruity","strong","dry"],shape:"beer",color:"gold",buy:7,fact:"Golden, strong and deceptively easy to drink. A monastery style."},{id:"quad",name:"Quadrupel",cat:"beer",abv:10.5,abvRange:"9\u201312",country:"Belgium",base:"grain",tags:["rich","strong","sweet"],shape:"bee buy:3,fact:'Vietnamese "fresh beer", brewed daily and drunk the same day on street corners.',flags:["fresh"]},{id:"taiwan_lager",name:"Taiwan Lager",cat:"beer",abv:4.5,abvRange:"4\u20135",country:"Taiwan",base:"grain",tags:["light","refreshing"],shape:"beer",color:"green",buy:4,fact:"Taiwanese lager often brewed with rice for an extra-crisp finish."},{id:"sahti",name:"Sahti",cat:"beer",abv:8,abvRange:"7\u201311",country:"Finland",base:"grain",tags:["fruity","strong","unusual"],shape:"jug",color:"honey",buy:7,fact:"Finnish farmhouse ale filtered through juniper branches, with little or no hops.",flags:["fresh"]},{id:"cider",name:"Cider",cat:"cider",abv:5,abvRange:"4\u20137",country:"England",base:"fruit",tags:["fruity","sparkling","refreshing"],shape:"beer",color:"lime",buy:4,fact:"Fermented apple juice. Not a beer: it belongs to the fruit family with perry and fruit wines."},{id:"dry_cider",name:"Dry Cider",cat:"cider",abv:6,abvRange:"5\u20138",country:"England",base:"fruit",tags:["dry","sparkling","refreshing"],shape:"beer",color:"straw",buy:5,fact:"Fermented until almost no sugar is left. Crisp and tart."},{id:"farmhouse_cider",name:"Farmhouse Cider",cat:"cider",abv:6.5,abvRange:"5\u20138",country:"England",base:"fruit",tags:["sour","dry","unusual"],shape:"jug",color:"straw",buy:6,fact:'Traditional still cider from bittersweet apples, called "scrumpy" in the West Country.'},{id:"cidre",name:"Cidre",cat:"cider",abv:4.5,abvRange:"2\u20135.5",country:"France",base:"fruit",tags:["sweet","sparkling","fruity"],shape:"spark",color:"gold",buy:6,fact:"Norman and Breton cider: often gently sparkling and on the sweeter side."},{id:"sidra",name:"Sidra",cat:"cider",abv:6,abvRange:"5\u20137",country:"Spain",base:"fruit",tags:["sour","dry"],shape:"spark",color:"green",buy:6,fact:"Asturian cider, poured from high above the glass to wake up its bubbles."},{id:"ice_cider",name:"Ice Cider",cat:"cider",abv:10,abvRange:"7\u201313",country:"Canada",base:"fruit",tags:["sweet","rich"],shape:"wine",color:"gold",buy:12,fact:"Made from frozen apple juice, which concentrates the sugar. A Quebec specialty."},{id:"perry",name:"Perry",cat:"cider",abv:5.5,abvRange:"4\u20137",country:"England",base:"fruit",tags:["fruity","sparkling","light"],shape:"spark",color:"straw",buy:6,fact:"Like cider, but made from pears. In France it's called poir\xE9."},{id:"mead",name:"Mead",cat:"cider",abv:12,abvRange:"8\u201316",country:"Various",base:"honey",tags:["sweet","floral"],shape:"wine",color:"honey",buy:8,fact:"Honey, water and yeast. Possibly the oldest fermented drink humans ever made."},{id:"melomel",name:"Melomel",cat:"cider",abv:11,abvRange:"8\u201314",country:"Various",base:"honey",tags:["fruity","sweet"],shape:"wine",color:"purple",buy:10,fact:"Mead made with fruit such as berries or cherries."},{id:"cyser",name:"Cyser",cat:"cider",abv:10,abvRange:"7\u201314",country:"Various",base:"honey",tags:["fruity","sweet"],shape:"wine",color:"gold",buy:10,fact:"Half cider, half mead: honey fermented with apple juice."},{id:"pyment",name:"Pyment",cat:"cider",abv:12,abvRange:"10\u201315",country:"Various",base:"honey",tags:["fruity","rich"],shape:"wine",color:"ruby",buy:11,fact:"Mead made with grapes, a honey-wine crossover."},{id:"metheglin",name:"Metheglin",cat:"cider",abv:12,abvRange:"8\u201315",country:"Wales",base:"honey",tags:["spicy","sweet","herbal"],shape:"wine",color:"honey",buy:11,fact:'Spiced mead. The name comes from Welsh words meaning "medicine" and "liquor".'},{id:"braggot",name:"Braggot",cat:"cider",abv:9,abvRange:"6\u201312",country:"England",base:"honey",tags:["rich","sweet","unusual"],shape:"beer",color:"honey",buy:9,fact:"Half beer, half mead: honey fermented together with malted barley."},{id:"bochet",name:"Bochet",cat:"cider",abv:13,abvRange:"10\u201316",country:"France",base:"honey",tags:["rich","sweet","unusual"],shape:"wine",color:"brown",buy:12,fact:"Made from honey caramelized before fermenting, giving toffee and marshmallow notes."},{id:"acergl :["fruity","dry"],shape:"wine",color:"purple",buy:8,fact:"Made in blueberry country like Maine: deep color and jammy fruit."},{id:"red",name:"Red Wine",cat:"wine",abv:13.5,abvRange:"12\u201315",country:"France",base:"grape",tags:["rich","dry"],shape:"wine",color:"ruby",buy:9,fact:"Grape skins soak in the juice while it ferments, adding color and tannin (that drying feeling)."},{id:"white",name:"White Wine",cat:"wine",abv:12,abvRange:"11\u201313.5",country:"Germany",base:"grape",tags:["dry","citrus","refreshing"],shape:"wine",color:"straw",buy:9,fact:"Usually made by pressing grapes and fermenting only the juice, without the skins. Serve chilled."},{id:"rose",name:"Ros\xE9",cat:"wine",abv:12,abvRange:"11\u201313",country:"France",base:"grape",tags:["fruity","refreshing","dry"],shape:"wine",color:"pink",buy:8,fact:"Pink because red grape skins touch the juice for just a few hours, usually not by mixing red and white."},{id:"prosecco",name:"Prosecco",cat:"wine",abv:11,abvRange:"10.5\u201311.5",country:"Italy",base:"grape",tags:["sparkling","fruity"],shape:"spark",color:"green",buy:10,fact:"An Italian sparkling wine, usually made fizzy in big pressurized tanks to keep it fresh and fruity."},{id:"champagne",name:"Champagne",cat:"wine",abv:12,abvRange:"11.5\u201312.5",country:"France",base:"grape",tags:["sparkling","dry"],shape:"spark",color:"emerald",buy:18,fact:'Only sparkling wine from Champagne, France, may use the name. Most is dry "Brut", but sweeter styles like Demi-Sec exist.'},{id:"cava",name:"Cava",cat:"wine",abv:11.5,abvRange:"11\u201312.5",country:"Spain",base:"grape",tags:["sparkling","dry"],shape:"spark",color:"green",buy:10,fact:"Spanish sparkling wine made the same bottle-fermented way as Champagne."},{id:"lambrusco",name:"Lambrusco",cat:"wine",abv:10,abvRange:"8\u201311",country:"Italy",base:"grape",tags:["sparkling","fruity"],shape:"spark",color:"ruby",buy:9,fact:"A fizzy red from Emilia-Romagna. Yes, red wine can sparkle!"},{id:"vinho_verde",name:"Vinho Verde",cat:"wine",abv:10,abvRange:"8.5\u201311.5",country:"Portugal",base:"grape",tags:["light","citrus","refreshing"],shape:"wine",color:"lime",buy:8,fact:'"Green wine" means young, not green-colored. Often has a slight spritz.'},{id:"riesling",name:"Riesling",cat:"wine",abv:10,abvRange:"7.5\u201312.5",country:"Germany",base:"grape",tags:["citrus","fruity","refreshing"],shape:"wine",color:"straw",buy:10,fact:"A grape that ranges from bone-dry to very sweet, so read the label."},{id:"bordeaux",name:"Bordeaux",cat:"wine",abv:13.5,abvRange:"12.5\u201314.5",country:"France",base:"grape",tags:["rich","dry"],shape:"wine",color:"ruby",buy:16,fact:"Usually a blend of grapes like Cabernet Sauvignon and Merlot, named after its region."},{id:"burgundy",name:"Burgundy",cat:"wine",abv:13,abvRange:"12.5\u201314",country:"France",base:"grape",tags:["dry","fruity"],shape:"wine",color:"ruby",buy:18,fact:"Red Burgundy is Pinot Noir, white Burgundy is Chardonnay. Here the vineyard matters more than the brand."},{id:"orange_wine",name:"Orange Wine",cat:"wine",abv:12.5,abvRange:"11\u201314",country:"Georgia",base:"grape",tags:["dry","unusual","bitter"],shape:"wine",color:"orange",buy:12,fact:"White grapes fermented with their skins. Georgia has made wine in clay qvevri jars for about 8,000 years."},{id:"natural_wine",name:"Natural Wine",cat:"wine",abv:12,abvRange:"10\u201313.5",country:"France",base:"grape",tags:["unusual","sour"],shape:"wine",color:"cream",buy:11,fact:"Made with minimal intervention: wild yeast and little or no added sulfites. Can be cloudy and funky."},{id:"malbec",name:"Malbec",cat:"wine",abv:14,abvRange:"13\u201315",country:"Argentina",base:"grape",tags:["rich","fruity"],shape:"wine",color:"ruby",buy:10,fact:"Originally French, but it found fame in the high vineyards of Mendoza."},{id:"torrontes",name:"Torront\xE9s",cat:"wine",abv:13,abvRange:"12.5\u201314",country:"Argentina",base:"grape",tags:["floral","dry"],shape:"wine",color:"straw",buy:9,fact:"Argentina's signature white: smells sweet and flowery, tastes dry."},{id:"shiraz",name:"Shiraz",cat:"wine",abv:14.5,abvRange:"13.5\u201315.5",country:"Australia",base:"grape",tags:["rich","spicy","fruity"],shape:"wine",color:"ruby",buy:10,fact:"Australia's name for the Syrah grape: bold, peppery and jammy."},{id:"sauv_blanc",name:"Sauvignon Blanc",cat:"wine",abv:13,abvRange:"12\u201313.5",country:"New Zealand",base:"grape",tags:["citrus","refreshing","dry"],shape:"wine",color:"lime",buy:10,fact:"Marlborough made this zingy, passion-fruit-and-grass style world famous."},{id:"tokaji",name:"Tokaji Asz\xFA",cat:"wine",abv:11,abvRange:"9\u201313",country:"Hungary",base:"grape",tags:["sweet","rich","unusual"],shape:"wine",color:"gold",buy:20,fact:'Made from grapes shriveled by "noble rot", a helpful mold that concentrates the sugar.'},{id:"icewine",name:"Icewine",cat:"wine",abv:10,abvRange:"8\u201313",country:"Canada",base:"grape",tags:["sweet","rich"],shape:"wine",color:"gold",buy:20,fact:"Grapes are picked frozen on the vine, so only syrupy, sugar-rich juice is pressed out."},{id:"vin_santo",name:"Vin Santo",cat:"wine",abv:15,abvRange:"14\u201317",country:"Italy",base:"grape",tags:["sweet","nutty"],shape:"wine",color:"amber",buy:14,fact:'"Holy wine" from dried grapes, traditionally served with cantucci biscuits for dipping.'},{id:"koshu",name:"Koshu",cat:"wine",abv:11.5,abvRange:"10.5\u201312.5",country:"Japan",base:"grape",tags:["light","citrus","dry"],shape:"wine",color:"straw",buy:12,fact:"Japan's own wine grape, grown near Mount Fuji. Delicate and crisp."},{id:"retsina",name:"Retsina",cat:"wine",abv:12,abvRange:"11\u201312.5",country:"Greece",base:"grape",tags:["herbal","dry","unusual"],shape:"wine",color:"straw",buy:8,fact:"White wine flavored with pine resin, a taste dating back to ancient jars sealed with resin."},{id:"sangria",name:"Sangria",cat:"wine",abv:9,abvRange:"4\u201312",country:"Spain",base:"grape",tags:["fruity","sweet","refreshing"],shape:"jug",color:"red",buy:7,fact:"A wine punch with fruit, sweetener and often brandy. Spain's party pitcher."},{id:"pipeno",name:"Pipe\xF1o",cat:"wine",abv:12,abvRange:"11\u201313",country:"Chile",base:"grape",tags:["light","fruity"],shape:"jug",color:"red",buy:7,fact:"Rustic, light red wine from old Pa\xEDs vines in southern Chile."},{id:"glogg",name:"Gl\xF6gg",cat:"wine",abv:10,abvRange:"8\u201312",country:"Sweden",base:"grape",tags:["sweet","spicy","rich"],shape:"wine",color:"red",buy:8,fact:"Scandinavian mulled wine, served warm at Christmas with raisins and almonds."},{id:"port",name:"Ruby Port",cat:"fortified",abv:20,abvRange:"19\u201322",country:"Portugal",base:"grape",tags:["sweet","rich","strong"],shape:"wine",color:"ruby",buy:14,fact:"Grape spirit is added mid-fermentation, stopping the yeast and leaving natural sweetness behind."},{id:"tawny_port",name:"Tawny Port",cat:"fortified",abv:20,abvRange:"19\u201321",country:"Portugal",base:"grape",tags:["rich","nutty","sweet"],shape:"wine",color:"brown",buy:16,fact:"Aged in small barrels until it turns amber-brown and nutty."},{id:"white_port",name:"White Port",cat:"fortified",abv:19,abvRange:"16.5\u201320",country:"Portugal",base:"grape",tags:["sweet","fruity"],shape:"wine",color:"gold",buy:12,fact:`Made from white grapes. In Porto it's mixed with tonic as a "Portonic".`},{id:"fino",name:"Fino Sherry",cat:"fortified",abv:15,abvRange:"15\u201316",country:"Spain",base:"grape",tags:["dry","nutty","unusual"],shape:"wine",color:"straw",buy:12,fact:'Aged under a layer of living yeast called "flor", which keeps it pale and bone-dry.'},{id:"manzanilla",name:"Manzanilla",cat:"fortified",abv:15,abvRange:"15\u201316",country:"Spain",base:"grape",tags:["dry","salty"],shape:"wine",color:"straw",buy:12,fact:"A fino-style sherry from seaside Sanl\xFAcar de Barrameda, often with a salty tang."},{id:"amontillado",name:"Amontillado",cat:"fortified",abv:18,abvRange:"16\u201319",country:"Spain",base:"grape",tags:["dry","nutty","rich"],shape:"wine",color:"ambe "red",buy:10,fact:"Wine flavored with herbs and spices, then fortified. Key to the Negroni and Manhattan."},{id:"dry_vermouth",name:"Dry Vermouth",cat:"fortified",abv:17,abvRange:"15\u201318",country:"France",base:"grape",tags:["herbal","dry"],shape:"wine",color:"straw",buy:10,fact:"The pale, less sweet style of vermouth, and the classic partner to gin in a Martini."},{id:"bianco_vermouth",name:"Bianco Vermouth",cat:"fortified",abv:16,abvRange:"14.8\u201318",country:"Italy",base:"grape",tags:["sweet","floral","herbal"],shape:"wine",color:"white",buy:11,fact:"Clear but sweet, with vanilla and floral notes. The in-between vermouth."},{id:"rose_vermouth",name:"Ros\xE9 Vermouth",cat:"fortified",abv:16,abvRange:"14.8\u201318",country:"France",base:"grape",tags:["fruity","herbal"],shape:"wine",color:"pink",buy:11,fact:"A newer style of vermouth made with ros\xE9 wine."},{id:"lillet",name:"Lillet Blanc",cat:"fortified",abv:17,abvRange:"17",country:"France",base:"grape",tags:["fruity","citrus","sweet"],shape:"wine",color:"gold",buy:13,fact:"A French aperitif wine with orange and quinine notes. It's in the Vesper and Corpse Reviver No. 2."},{id:"dubonnet",name:"Dubonnet",cat:"fortified",abv:15,abvRange:"14.8\u201319",country:"France",base:"grape",tags:["sweet","herbal","bitter"],shape:"wine",color:"ruby",buy:12,fact:"An aromatized wine with quinine, created in 1846 to make medicine taste better for French soldiers."},{id:"vodka",name:"Vodka",cat:"spirit",abv:40,abvRange:"37.5\u201350",country:"Poland",base:"grain",tags:["strong","neutral"],shape:"spirit",color:"clear",buy:12,fact:"Distilled to a very high strength, then diluted and often filtered, so little flavor remains. Perfect for mixing."},{id:"bison_vodka",name:"Bison Grass Vodka",cat:"spirit",abv:40,abvRange:"37.5\u201340",country:"Poland",base:"grain",tags:["herbal","neutral"],shape:"spirit",color:"clear",buy:14,fact:"Polish vodka with a blade of bison grass in each bottle, tasting of vanilla and fresh hay."},{id:"gin",name:"Gin",cat:"spirit",abv:40,abvRange:"37.5\u201347",country:"England",base:"grain",tags:["strong","herbal","dry"],shape:"spirit",color:"mint",buy:14,fact:"Gin's main flavor must be juniper. Most gins add citrus peel, coriander and other botanicals."},{id:"genever",name:"Genever",cat:"spirit",abv:38,abvRange:"35\u201342",country:"Netherlands",base:"grain",tags:["herbal","rich"],shape:"flask",color:"clear",buy:16,fact:"The Dutch ancestor of gin, made on a malty grain base and often sold in clay bottles."},{id:"rum",name:"Rum",cat:"spirit",abv:40,abvRange:"37.5\u201340",country:"Barbados",base:"sugarcane",tags:["strong","sweet"],shape:"spirit",color:"copper",buy:13,fact:"Distilled from sugarcane, usually molasses. Aged rums pick up color and vanilla from barrels."},{id:"rhum_agricole",name:"Rhum Agricole",cat:"spirit",abv:50,abvRange:"40\u201355",country:"Martinique",base:"sugarcane",tags:["strong","herbal","earthy"],shape:"spirit",color:"clear",buy:18,fact:"Distilled from fresh cane juice, not molasses, so it tastes grassy and funky."},{id:"clairin",name:"Clairin",cat:"spirit",abv:50,abvRange:"45\u201355",country:"Haiti",base:"sugarcane",tags:["strong","earthy","unusual"],shape:"spirit",color:"clear",buy:16,fact:"Haiti's village cane spirit, often from heirloom cane and wild fermentation."},{id:"batavia_arrack",name:"Batavia Arrack",cat:"spirit",abv:50,abvRange:"48\u201350",country:"Indonesia",base:"sugarcane",tags:["strong","smoky","unusual"],shape:"spirit",color:"amber",buy:18,fact:"Javanese spirit from cane and fermented red rice. A secret of 1700s punch."},{id:"mamajuana",name:"Mamajuana",cat:"spirit",abv:30,abvRange:"20\u201340",country:"Dominican Republic",base:"sugarcane",tags:["herbal","sweet","unusual"],shape:"jug",color:"brown",buy:12,fact:"Rum, red wine and honey soaked with tree bark and herbs. Bottles are refilled again and again."},{id:"aguardiente",name:"Aguardiente",cat:"spirit",abv:29,abvRange:"24\u201330",country:"Colombia",base:"sugarcane",tag 0\u201346",country:"Scotland",base:"grain",tags:["strong","rich"],shape:"spirit",color:"amber",buy:18,fact:'Aged at least three years in oak in Scotland. Scotland and Japan write "whisky"; Ireland and the US mostly write "whiskey".'},{id:"islay",name:"Islay Scotch",cat:"spirit",abv:46,abvRange:"40\u201358",country:"Scotland",base:"grain",tags:["strong","smoky","salty","unusual"],shape:"spirit",color:"brown",buy:24,fact:"Barley dried over peat fires gives these whiskies a bold, smoky, seaside taste."},{id:"speyside",name:"Speyside Malt",cat:"spirit",abv:43,abvRange:"40\u201346",country:"Scotland",base:"grain",tags:["fruity","rich","strong"],shape:"spirit",color:"gold",buy:22,fact:"Scotland's busiest whisky region, known for fruity, honeyed malts."},{id:"irish_whiskey",name:"Irish Whiskey",cat:"spirit",abv:40,abvRange:"40\u201346",country:"Ireland",base:"grain",tags:["strong","sweet"],shape:"spirit",color:"gold",buy:17,fact:"Often triple-distilled for a lighter, smoother style."},{id:"bourbon",name:"Bourbon",cat:"spirit",abv:45,abvRange:"40\u201360",country:"USA",base:"grain",tags:["strong","sweet","rich"],shape:"spirit",color:"amber",buy:18,fact:"At least 51% corn, aged in new charred oak barrels. The new oak gives vanilla and caramel."},{id:"rye",name:"Rye Whiskey",cat:"spirit",abv:45,abvRange:"40\u201355",country:"USA",base:"grain",tags:["strong","spicy","dry"],shape:"spirit",color:"copper",buy:19,fact:"Made mostly from rye grain, which gives a spicier, drier whiskey. The original Manhattan base."},{id:"tennessee",name:"Tennessee Whiskey",cat:"spirit",abv:40,abvRange:"40\u201350",country:"USA",base:"grain",tags:["strong","sweet"],shape:"spirit",color:"amber",buy:17,fact:"Filtered through sugar-maple charcoal before ageing, known as the Lincoln County Process."},{id:"corn_whiskey",name:"Corn Whiskey",cat:"spirit",abv:45,abvRange:"40\u201362",country:"USA",base:"grain",tags:["strong","sweet","unusual"],shape:"spirit",color:"clear",buy:14,fact:"Can be sold unaged and clear. It's the legal descendant of moonshine."},{id:"japanese_whisky",name:"Japanese Whisky",cat:"spirit",abv:43,abvRange:"40\u201348",country:"Japan",base:"grain",tags:["strong","rich","floral"],shape:"spirit",color:"gold",buy:22,fact:"Modeled on Scotch in the 1920s, now famous for elegant, balanced blends."},{id:"taiwan_whisky",name:"Taiwanese Whisky",cat:"spirit",abv:46,abvRange:"40\u201358",country:"Taiwan",base:"grain",tags:["rich","fruity","strong"],shape:"spirit",color:"amber",buy:22,fact:"Taiwan's heat matures whisky fast. A year there can do the work of several in Scotland."},{id:"poitin",name:"Poit\xEDn",cat:"spirit",abv:50,abvRange:"40\u201390",country:"Ireland",base:"grain",tags:["strong","unusual"],shape:"spirit",color:"clear",buy:15,fact:"Irish spirit that was illegal to make for over 300 years, until 1997."},{id:"aquavit",name:"Aquavit",cat:"spirit",abv:40,abvRange:"37.5\u201345",country:"Denmark",base:"potato",tags:["herbal","strong"],shape:"spirit",color:"clear",buy:15,fact:"Scandinavian spirit flavored with caraway or dill, made from grain or potatoes."},{id:"linie",name:"Linie Aquavit",cat:"spirit",abv:41.5,abvRange:"41.5",country:"Norway",base:"potato",tags:["herbal","rich","unusual"],shape:"spirit",color:"gold",buy:18,fact:"Shipped across the equator and back in sherry casks before bottling. The waves are said to help it age."},{id:"brennivin",name:"Brenniv\xEDn",cat:"spirit",abv:37.5,abvRange:"37.5",country:"Iceland",base:"grain",tags:["herbal","strong","unusual"],shape:"spirit",color:"clear",buy:16,fact:`Iceland's caraway schnapps, nicknamed "Black Death". Traditionally chased with fermented shark.`,flags:["weird"]},{id:"cognac",name:"Cognac",cat:"spirit",abv:40,abvRange:"40\u201345",country:"France",base:"grape",tags:["strong","rich","fruity"],shape:"liqueur",color:"copper",buy:22,fact:"Brandy is distilled from wine. Cognac comes from one French region, double-distilled and aged in oak."},{id:"armagnac",name:"Armagnac",cat:"spirit",abv:42,ab tion, unpaid wages mean your staff stop trying, and a missed loan payment adds interest."},{id:"stock",screen:"toStock",name:"Ordering stock",when:function(){return!0},text:"Orders arrive tomorrow morning. Bulk is cheaper per bottle, express costs more but arrives now. Prices move a little each day, and the more you buy from a category the better your supplier treats you."},{id:"id",screen:"openDay",name:"Checking ID",when:function(e){return e.stats.customers>3},text:"Some customers show a resident card. Work out their age from the date of birth, then look for the tell-tales: handwriting where print belongs, an odd date format, strange spacing, a photo that is not them, or an expired card. Refusing a fake is always right, even though it costs the sale."},{id:"care",screen:"openDay",name:"Looking after people",when:function(e){return e.stats.customers>3},text:"If someone has clearly had enough, offer water or something alcohol-free. It earns trust, not coins, and trust brings people back. The same goes for drivers: keep the alcohol-free shelf stocked."},{id:"trust",screen:"toReviews",name:"Reputation and trust",when:function(e){return e.day>2},text:"Reputation comes from good matches and fades a little each night; above 80 only rare bottles and museum exhibits push it higher. Trust is separate: it grows when you look after people and answer their questions, and it brings bigger tips and more visitors."},{id:"missions",name:"Missions and chapters",screen:"toMissions",when:function(){return!0},text:'Missions are the spine of the game. Each chapter sets two goals; finish both, claim the reward, and the next chapter opens a new shelf, the lab, the rare room or the museum. Counters like "make 6 sales" measure from the moment a chapter starts, so a mission is never already finished the day it appears.'},{id:"arcade",name:"The arcade",screen:"toArcade",when:function(){return!0},text:"Short games that drill what the shop teaches. The first play of each game per day pays a few coins, up to a daily cap; after that they are practice. Every game only ever uses bottles you have discovered and cocktails you have found, so nothing here spoils a surprise. Time Order sorts drinks oldest to newest; Layered Shot pours heaviest first; Shelf Sort runs lightest to strongest; Delivery Run finds the shortest route round four stops; Blind Tasting names a drink from its flavour words and strength alone, with all four answers from the same category."},{id:"rare",name:"The rare room",screen:"toRare",when:function(){return t.rareUnlocked()},text:"Rare bottles are offered a few at a time, and some have to be hunted over several days before they turn up. They cost a lot and sell for nothing, because they are not stock \u2014 they are the only thing that pushes reputation above 80, along with museum exhibits. The auction is the same idea with a rival bidder: bid what it is worth to you, because you only pay if you win."},{id:"museum",name:"The museum",screen:"toMuseum",when:function(){return t.museumUnlocked()},text:"Exhibits tell the story of how drinking got to where it is: an era at a time, from ancient brewing to the cocktail revival. Opening one costs coins and adds prestige reputation. They are also where the Time Order game gets its material before you have discovered many cocktails of your own."},{id:"groups",screen:"openDay",name:"Rounds for a table",when:function(e){return e.chapter>=4},text:"From chapter 4 a group walks in: several friends at once, each with their own flavour and their own reason for it. Tap a friend, then tap a bottle, and repeat. The table shares one budget, so three expensive bottles on a small budget is still overspending. You do not have to fill every slot \u2014 serve what you can match and you are paid for the glasses you actually poured, but a table where someone went without is never a perfect round. Get everyone right and that same table comes back."},{id:"complaints",name:"Complaints and returns",screen:"toMail",when:function(e){return(e.complaints||[]).length>0||e.stats.complaintsSettled>0},text:"Sell someone the wrong thing and they may come back the next morning, at the head of the queue. You can refund in full, refund half, swap the bottle, or stand behind the sale. The first three cost money and keep trust; standing firm keeps the money and costs trust. Waving them away without dealing with it costs the most of all, and they stop coming back \u2014 which is worse for the shop, not better."},{id:"letters",name:"Letters",screen:"toMail",when:function(e){return(e.mail||[]).length>0},text:"Aunt Rosie writes as the shop grows, and also when something actually happens \u2014 a first rare bottle, a lost contract, a whole shelf learned. Some letters can be answered. What you write back changes how much the town trusts you, so answer them the way you would actually run the shop."},{id:"rival",name:"The shop across the road",screen:"toReviews",when:function(e){return e.day>7},text:"The Corner Cellar reacts to your week: it grows when you coast and shrinks when you shine, and it can never get further ahead than your chapter allows. While it is ahead of you it pulls customers away and outbids you at the wholesaler on whichever category it is pushing that week, which shows up on the Money tab as a higher price. You do not beat it on price. You beat it by being the shop that knows things."},{id:"cellar",screen:"toOffice",name:"The cellar",when:function(e){return e.chapter>=4},text:"Bottles marked age-worthy improve while they rest in the cellar: about 4% more value per day, up to +60%. Space is limited, so lay down the things worth waiting for. Adding a young bottle to an old batch averages the age."},{id:"office",screen:"toOffice",name:"The back office",when:function(e){return e.chapter>=4},text:"Train Momo for patience, Mochi for cheaper orders and Bruno for wine tips. Hire helpers for extra customers, free bulk bottles, cheaper loans or more rare finds. Everyone costs wages every night."
